<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MOCHKIL | SNACK ATTACK</title>
    <style>
        /* MOCHKIL THEME: NEON ORANGE & CHAOS */
        :root {
            --mochkil-orange: #FF9800;
            --bg-black: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            overflow: hidden; /* Prevents awkward double scrolling */
            display: flex;
            flex-direction: column;
        }

        /* Full Screen Header with Dynamic Island/Notch Support */
        .status-bar {
            background: var(--bg-black);
            color: var(--mochkil-orange);
            text-align: center;
            /* This line ensures the text sits perfectly below the iPhone notch */
            padding-top: env(safe-area-inset-top, 44px); 
            padding-bottom: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid #332211;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.1);
        }

        /* This container expands to fill the rest of the screen */
        #mcontext {
            flex: 1;
            width: 100%;
            height: 100%;
            background: var(--bg-black);
        }

        /* Force the MessengerX iframe to fill the container */
        #mcontext iframe {
            height: 100% !important;
            width: 100% !important;
            border: none;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        MOCHKIL_CHEF // SNACK_ATTACK_v1.0
    </div>

    <div id="mcontext">
        <script 
            mode="embed" 
            isolate="true" 
            themecolor="#FF9800" 
            header="off" 
            accentcolor="#000000" 
            textcolor="white" 
            id="webchat" 
            src="https://cdn.machaao.com/prod/web/js/embed.js" 
            type="text/javascript" 
            mkey="ZmJiNWFkMTAtMjI1OC0xMWYxLTkwZmQtNTEzZDJlMTU0MWU5">
        </script>
    </div>

</body>
</html>
