<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximum Reality // Neon Simulation</title>
    <style>
        /* Reset and Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0c;
            color: #e2e2e9;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* Header Image Stack Container */
        .flicker-header {
            position: relative;
            width: 100%;
            height: 60vh; 
            background-color: #000;
            overflow: hidden;
            border-bottom: 2px solid #1a1a24;
        }

        /* Shared image formatting to guarantee perfect alignment */
        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* The Dark Frame (Base Layer) */
        .base-lightless {
            z-index: 1;
        }

        /* The Neon Frame (Top Layer) */
        .neon-glow {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.015s ease-in-out; 
            filter: drop-shadow(0 0 10px rgba(255, 0, 128, 0.3));
        }

        /* State triggered by the JS engine */
        .neon-glow.active {
            opacity: 1;
        }

        /* Audio Toggle Button Custom Styling */
        .audio-control-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(10, 10, 12, 0.75);
            border: 1px solid #ff007f;
            color: #ff007f;
            font-size: 1.5rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
            transition: all 0.2s ease;
        }

        .audio-control-btn:hover {
            background: #ff007f;
            color: #0a0a0c;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        /* Demo Content Section */
        .content-area {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
        }

        p {
            color: #8a8a9e;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Header Component -->
    <header class="flicker-header">
        <!-- Audio Control Button -->
        <button id="audioToggle" class="audio-control-btn" title="Toggle Background Music">🔇</button>

        <!-- Hidden Audio Element configured to loop -->
        <audio id="bgMusic" src="https://maximumreality.xyz/neon/AUDIO/dont_let-go.mp3" loop prefetch="auto"></audio>

        <!-- Lights Off Frame -->
        <img src="IMG/IMG_0172.jpeg" alt="Dreamcore Base Scene" class="header-bg base-lightless">
        
        <!-- Lights On Frame -->
        <img src="IMG/IMG_0173.jpeg" alt="Dreamcore Neon Active" class="header-bg neon-glow" id="neonLayer">
    </header>

    <!-- Page Content Placeholder -->
    <main class="content-area">
        <h1>Simulation Node Active</h1>
        <p>The transition layer between reality states is fluctuating. Watch the signs closely.</p>
    </main>

    <!-- Organic Flicker & Audio Engine -->
    <script>
        // --- Flicker Setup ---
        const neonLayer = document.getElementById('neonLayer');

        function runFlickerEngine() {
            const isActive = neonLayer.classList.toggle('active');
            let nextTick = 100; 

            if (isActive) {
                const roll = Math.random();
                if (roll > 0.4) {
                    nextTick = Math.random() * 3500 + 1500;
                } else {
                    nextTick = Math.random() * 120 + 30;
                }
            } else {
                const roll = Math.random();
                if (roll > 0.5) {
                    nextTick = Math.random() * 1100 + 400;
                } else {
                    nextTick = Math.random() * 80 + 20;
                }
            }

            setTimeout(runFlickerEngine, nextTick);
        }

        // --- Audio Control Setup ---
        const bgMusic = document.getElementById('bgMusic');
        const audioToggle = document.getElementById('audioToggle');

        audioToggle.addEventListener('click', () => {
            if (bgMusic.paused) {
                // Play audio and change icon to unmuted
                bgMusic.play().then(() => {
                    audioToggle.textContent = '🔊';
                }).catch(err => {
                    console.log("Playback blocked by browser auto-play policies. Try clicking again.", err);
                });
            } else {
                // Pause audio and change icon back to muted
                bgMusic.pause();
                audioToggle.textContent = '🔇';
            }
        });

        // Initialize the light cycle on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runFlickerEngine, 500);
        });
    </script>
</body>
</html>
