<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Exit Vectors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen arcade cabinet. HUD on top, board fills the middle, tool tray at the bottom. Deliberately single dark theme. */
:root{
  --bg:#0c0e19;
  --panel:#151a2d;
  --panel-hi:#1e2540;
  --fg:#e8ecff;
  --muted:#8790b8;
  --dot:rgba(200,210,255,.14);
  --accent:#ff4fa3;
  --hard:#c12fd1;
  --good:#4be37a;
  --bad:#ff4b5c;
  --star:#ffd23f;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);
  display:flex;flex-direction:column;padding-inline:16px;padding-block:10px;gap:10px;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  background:var(--panel);border-radius:18px;padding:12px 16px;max-width:560px;width:100%;margin-inline:auto}
.lvl{display:flex;flex-direction:column;gap:2px;min-width:0}
.tag{align-self:flex-start;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  background:var(--hard);color:#fff;padding:2px 8px;border-radius:6px}
.lvl strong{font-size:24px;line-height:1;letter-spacing:.02em}
.meter{display:flex;flex-direction:column;align-items:center;gap:6px}
.hearts{display:flex;gap:4px}
.hearts svg{width:20px;height:20px;transition:transform .2s,opacity .2s}
.hearts svg.lost{opacity:.18;transform:scale(.8)}
.bar{width:110px;height:6px;border-radius:3px;background:var(--panel-hi);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--good);transition:width .25s}
.count{justify-self:end;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;
  font-variant-numeric:tabular-nums;line-height:1.35}
.count b{display:block;color:var(--fg);font-size:18px;font-family:var(--display)}

.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;display:block}

.tray{display:flex;justify-content:center;gap:12px;max-width:560px;width:100%;margin-inline:auto}
.tool{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--panel);border:0;border-radius:16px;padding:10px 6px 8px;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:background .15s,transform .1s}
.tool:active{transform:scale(.96);background:var(--panel-hi)}
.tool svg{width:28px;height:28px}
.tool .inf{font-family:var(--mono);font-size:10px;color:var(--good);letter-spacing:0}

.overlay{position:fixed;inset:0;background:rgba(6,7,14,.78);display:flex;align-items:center;justify-content:center;
  padding:24px 16px;z-index:5;backdrop-filter:blur(3px)}
.card{background:var(--panel);border-radius:22px;padding:26px 22px;width:100%;max-width:340px;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.card h2{margin:0;font-size:28px;line-height:1.1;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-family:var(--mono);font-size:13px}
.stars{display:flex;gap:8px}
.stars svg{width:44px;height:44px}
.stars svg.off{opacity:.18}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:700;letter-spacing:.04em;
  background:var(--good);color:#06210f}
.btn.ghost{background:var(--panel-hi);color:var(--fg);font-size:15px;padding:11px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-height:52vh;overflow-y:auto;padding:2px}
.levels button{border:0;border-radius:10px;background:var(--panel-hi);padding:10px 0 6px;font-size:16px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.levels button small{font-size:9px;color:var(--star);letter-spacing:1px;min-height:11px}
.levels button.cur{outline:2px solid var(--accent)}
.levels button:disabled{opacity:.3;cursor:default}
.levels button.hard{color:#ef9cff}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--panel-hi);
  padding:8px 14px;border-radius:10px;font-family:var(--mono);font-size:13px;z-index:4;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="hud">
  <div class="lvl">
    <span class="tag" id="hardTag" hidden>Hard level</span>
    <strong id="lvlLabel">LVL 1</strong>
  </div>
  <div class="meter">
    <div class="hearts" id="hearts" aria-label="Lives"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="count"><b id="left">0</b>arrows left</div>
</header>

<main class="stage" id="stage"><canvas id="cv" aria-label="Puzzle board. Tap an arrow to slide it off the board."></canvas></main>

<nav class="tray">
  <button class="tool" id="hintBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    Hint<span class="inf">unlimited</span>
  </button>
  <button class="tool" id="restartBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3fd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
    Restart<span class="inf">&nbsp;</span>
  </button>
  <button class="tool" id="levelsBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="#a77bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Levels<span class="inf">&nbsp;</span>
  </button>
</nav>

<div class="overlay" id="winOv" hidden>
  <div class="card">
    <div class="stars" id="winStars"></div>
    <h2 id="winTitle">Level cleared</h2>
    <p id="winSub">No ads. Straight to the next one.</p>
    <button class="btn" id="nextBtn" type="button">Next level</button>
    <button class="btn ghost" id="replayBtn" type="button">Replay</button>
  </div>
</div>
<div class="overlay" id="failOv" hidden>
  <div class="card">
    <h2>Out of lives</h2>
    <p>Three blocked moves. Same board, fresh start.</p>
    <button class="btn" id="retryBtn" type="button">Try again</button>
  </div>
</div>
<div class="overlay" id="lvlOv" hidden>
  <div class="card">
    <h2>Levels</h2>
    <div class="levels" id="lvlGrid"></div>
    <button class="btn ghost" id="lvlClose" type="button">Close</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== GENERATOR START ===== */
const PALETTE=['#ff4fa3','#3fd0ff','#ffd23f','#4be37a','#a77bff','#4f7dff'];
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SHAPES={
  rect:()=>true,
  split:(c,r,C,R)=>c!==Math.floor(C/2),
  quad:(c,r,C,R)=>c!==Math.floor(C/2)&&r!==Math.floor(R/2),
  ring:(c,r,C,R)=>!(c>=Math.floor(C/3)&&c<Math.ceil(2*C/3)&&r>=Math.floor(R/3)&&r<Math.ceil(2*R/3)),
  diamond:(c,r,C,R)=>{const cx=(C-1)/2,cy=(R-1)/2;return Math.abs(c-cx)/(C/2)+Math.abs(r-cy)/(R/2)<=1.08},
  notch:(c,r,C,R)=>!(c<Math.floor(C/2)&&r<Math.floor(R/3)),
  cross:(c,r,C,R)=>(c>=Math.floor(C/4)&&c<Math.ceil(3*C/4))||(r>=Math.floor(R/4)&&r<Math.ceil(3*R/4)),
};
const SHAPE_KEYS=Object.keys(SHAPES);
function levelSpec(n){
  const rnd=mulberry32(n*7919+13);
  const hard=n>=5&&n%5===0;
  const cols=Math.min(5+Math.floor((n-1)/2),12);
  const rows=Math.min(cols+2+Math.floor(n/8),16);
  const maxLen=Math.min(3+Math.floor(n/2),11)+(hard?5:0);
  const shape=n<4?'rect':SHAPE_KEYS[Math.floor(rnd()*SHAPE_KEYS.length)];
  return {n,hard,cols,rows,maxLen,shape};
}
/* Builds arrows in reverse removal order: each new arrow's exit ray must be clear of every arrow
   placed before it. Arrows placed later may sit in its path, but they leave first. So every board is solvable. */
function generate(spec){
  const {cols:C,rows:R,maxLen}=spec;const rnd=mulberry32(spec.n*104729+spec.n*31+1);
  const mask=new Uint8Array(C*R);const shapeFn=SHAPES[spec.shape];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)mask[r*C+c]=shapeFn(c,r,C,R)?1:0;
  const occ=new Int16Array(C*R).fill(-1);const arrows=[];
  const inB=(c,r)=>c>=0&&c<C&&r>=0&&r<R;
  const free=(c,r)=>inB(c,r)&&mask[r*C+c]&&occ[r*C+c]===-1;
  const total=mask.reduce((a,b)=>a+b,0);let fails=0;
  while(fails<total*8){
    const empties=[];for(let i=0;i<C*R;i++)if(mask[i]&&occ[i]===-1)empties.push(i);
    if(empties.length<2)break;
    const h=empties[Math.floor(rnd()*empties.length)],hc=h%C,hr=(h/C)|0;
    const order=DIRS.slice().sort(()=>rnd()-.5);let placed=false;
    for(const [dx,dy] of order){
      const ray=new Set();let c=hc+dx,r=hr+dy,ok=true;
      while(inB(c,r)){if(occ[r*C+c]!==-1){ok=false;break}ray.add(r*C+c);c+=dx;r+=dy}
      if(!ok)continue;
      const bc=hc-dx,br=hr-dy;if(!free(bc,br))continue;
      const L=2+Math.floor(Math.pow(rnd(),.6)*(maxLen-1));
      const path=[[hc,hr],[bc,br]];const used=new Set([h,br*C+bc]);
      let cur=[bc,br],dir=[-dx,-dy];
      while(path.length<L){
        const opts=[[dir,2],[[dir[1],-dir[0]],3],[[-dir[1],dir[0]],3]].filter(([d])=>{
          const nc=cur[0]+d[0],nr=cur[1]+d[1],k=nr*C+nc;return free(nc,nr)&&!used.has(k)&&!ray.has(k)});
        if(!opts.length)break;
        let w=opts.reduce((a,o)=>a+o[1],0)*rnd(),pick=opts[0];
        for(const o of opts){w-=o[1];if(w<=0){pick=o;break}}
        dir=pick[0];cur=[cur[0]+dir[0],cur[1]+dir[1]];path.push(cur);used.add(cur[1]*C+cur[0]);
      }
      const id=arrows.length;for(const [pc,pr] of path)occ[pr*C+pc]=id;
      arrows.push({id,cells:path.reverse(),d:[dx,dy],color:PALETTE[Math.floor(rnd()*PALETTE.length)]});
      placed=true;break;
    }
    if(!placed)fails++;
  }
  return {mask,arrows,C,R};
}
/* ===== GENERATOR END ===== */

// ---------- persistence ----------
const KEY='exitVectors.v1';
let save={unlocked:1,current:1,stars:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.unlocked)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

// ---------- state ----------
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let G=null,view={cs:20,ox:0,oy:0,w:0,h:0};
const MAX_HEARTS=3;

function startLevel(n){
  const spec=levelSpec(n);const g=generate(spec);
  const occ=new Int16Array(g.C*g.R).fill(-1);
  const ext=g.C+g.R+4;
  for(const a of g.arrows){
    for(const [c,r] of a.cells)occ[r*g.C+c]=a.id;
    const [hc,hr]=a.cells[a.cells.length-1];a.path=a.cells.slice();
    for(let i=1;i<=ext+a.cells.length;i++)a.path.push([hc+a.d[0]*i,hr+a.d[1]*i]);
    a.alive=true;a.state='idle';a.t=0;a.v=0;a.flash=0;a.gone=false;
  }
  G={n,spec,...g,occ,hearts:MAX_HEARTS,mistakes:0,hint:null,hintT:0,over:false};
  save.current=n;persist();
  ['winOv','failOv'].forEach(id=>$(id).hidden=true);
  $('lvlLabel').textContent='LVL '+n;$('hardTag').hidden=!spec.hard;
  layout();updateHud();
}
function aliveCount(){return G.arrows.filter(a=>a.alive).length}
function updateHud(){
  const left=aliveCount(),tot=G.arrows.length;
  $('left').textContent=left;$('bar').style.width=((tot-left)/tot*100)+'%';
  const H=$('hearts');H.innerHTML='';
  for(let i=0;i<MAX_HEARTS;i++)H.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 24 24" class="${i<G.hearts?'':'lost'}"><path fill="#ff4b5c" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.6 4.5c2.2 0 3.6 1.2 4.4 2.5.8-1.3 2.2-2.5 4.4-2.5 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>`);
}

// ---------- layout ----------
function layout(){
  const st=$('stage'),dpr=Math.min(window.devicePixelRatio||1,3);
  const w=st.clientWidth,h=st.clientHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  view.w=w;view.h=h;if(!G)return;
  const cs=Math.floor(Math.min(w/(G.C+0.6),h/(G.R+0.6)));
  view.cs=cs;view.ox=(w-cs*G.C)/2;view.oy=(h-cs*G.R)/2;
}
new ResizeObserver(layout).observe($('stage'));

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  if(!G||G.over)return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left-view.ox)/view.cs,y=(e.clientY-rect.top-view.oy)/view.cs;
  let best=null,bd=0.95;
  const c0=Math.floor(x),r0=Math.floor(y);
  for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++){
    if(c<0||r<0||c>=G.C||r>=G.R)continue;const id=G.occ[r*G.C+c];if(id<0)continue;
    const d=Math.hypot(x-(c+.5),y-(r+.5));if(d<bd){bd=d;best=G.arrows[id]}
  }
  if(best)tryMove(best);
});
function rayInfo(a){
  const [hc,hr]=a.cells[a.cells.length-1];let c=hc+a.d[0],r=hr+a.d[1],k=0;
  while(c>=0&&c<G.C&&r>=0&&r<G.R){const o=G.occ[r*G.C+c];if(o!==-1&&o!==a.id)return {blocked:true,k};k++;c+=a.d[0];r+=a.d[1]}
  return {blocked:false,k};
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function tryMove(a){
  if(!a.alive||a.state!=='idle')return;
  if(G.hint===a.id)G.hint=null;
  const {blocked,k}=rayInfo(a);
  if(!blocked){
    a.alive=false;a.state='exit';a.t=0;a.v=6;a.end=a.cells.length+k+3;
    for(const [c,r] of a.cells)G.occ[r*G.C+c]=-1;
    updateHud();
    if(aliveCount()===0){G.over=true;setTimeout(win,650)}
  }else{
    a.state='bump';a.t=0;a.bumpTo=k+0.38;a.back=false;a.flash=1;
    G.hearts--;G.mistakes++;updateHud();buzz(60);
    if(G.hearts<=0){G.over=true;setTimeout(()=>{$('failOv').hidden=false},700)}
  }
}

// ---------- outcomes ----------
const STAR_SVG=on=>`<svg viewBox="0 0 24 24" class="${on?'':'off'}"><path fill="#ffd23f" stroke="#b8860b" stroke-width=".8" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z"/></svg>`;
function win(){
  const stars=Math.max(1,3-G.mistakes),n=G.n;
  save.stars[n]=Math.max(save.stars[n]||0,stars);save.unlocked=Math.max(save.unlocked,n+1);persist();
  $('winStars').innerHTML=[1,2,3].map(i=>STAR_SVG(i<=stars)).join('');
  $('winTitle').textContent=`Level ${n} cleared`;
  $('winSub').textContent=G.mistakes?`${G.mistakes} blocked move${G.mistakes>1?'s':''}. No ads, straight on.`:'Flawless. No ads, straight on.';
  $('winOv').hidden=false;$('nextBtn').focus();
}
$('nextBtn').onclick=()=>startLevel(G.n+1);
$('replayBtn').onclick=()=>startLevel(G.n);
$('retryBtn').onclick=()=>startLevel(G.n);
$('restartBtn').onclick=()=>startLevel(G.n);
$('hintBtn').onclick=()=>{
  if(!G||G.over)return;
  const a=G.arrows.find(a=>a.alive&&a.state==='idle'&&!rayInfo(a).blocked);
  if(a){G.hint=a.id;G.hintT=0}
};
$('levelsBtn').onclick=()=>{
  const grid=$('lvlGrid'),max=Math.max(30,Math.ceil((save.unlocked+5)/10)*10);grid.innerHTML='';
  for(let i=1;i<=max;i++){
    const b=document.createElement('button');b.type='button';
    const s=save.stars[i]||0;b.innerHTML=`${i}<small>${'★'.repeat(s)}</small>`;
    if(i>save.unlocked)b.disabled=true;if(i===G.n)b.classList.add('cur');if(levelSpec(i).hard)b.classList.add('hard');
    b.onclick=()=>{$('lvlOv').hidden=true;startLevel(i)};grid.appendChild(b);
  }
  $('lvlOv').hidden=false;
};
$('lvlClose').onclick=()=>{$('lvlOv').hidden=true};

// ---------- render ----------
function pointAt(p,s){const i=Math.max(0,Math.min(Math.floor(s),p.length-2)),f=s-i;
  return [p[i][0]+(p[i+1][0]-p[i][0])*f,p[i][1]+(p[i+1][1]-p[i][1])*f,p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]]}
function drawArrow(a,now){
  const {cs,ox,oy}=view,L=a.cells.length-1,s0=a.t,s1=a.t+L;
  const X=v=>ox+(v+.5)*cs,Y=v=>oy+(v+.5)*cs;
  const pts=[pointAt(a.path,s0)];
  for(let i=Math.floor(s0)+1;i<s1;i++)if(i>s0)pts.push(a.path[i]);
  const head=pointAt(a.path,s1-1e-6);
  const hx=X(head[0]),hy=Y(head[1]);
  let col=a.color;
  if(a.flash>0)col=a.flash>.5?'#ff4b5c':a.color;
  ctx.save();
  if(G.hint===a.id){const p=.5+.5*Math.sin(now/140);ctx.shadowColor=a.color;ctx.shadowBlur=8+14*p;ctx.lineWidth=cs*(0.17+0.05*p)}
  else ctx.lineWidth=Math.max(2.5,cs*0.15);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(let i=1;i<pts.length;i++)ctx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  ctx.lineTo(hx,hy);ctx.stroke();
  const dx=head[2],dy=head[3],tip=cs*0.36,hw=cs*0.24;
  ctx.beginPath();ctx.moveTo(hx+dx*tip,hy+dy*tip);
  ctx.lineTo(hx-dx*cs*0.05+dy*hw,hy-dy*cs*0.05-dx*hw);
  ctx.lineTo(hx-dx*cs*0.05-dy*hw,hy-dy*cs*0.05+dx*hw);ctx.closePath();ctx.fill();
  ctx.restore();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.clearRect(0,0,view.w,view.h);
  if(G){
    for(const a of G.arrows){
      if(a.state==='exit'){a.v=Math.min(a.v+90*dt,40);a.t+=a.v*dt;if(a.t>a.end){a.state='gone'}}
      else if(a.state==='bump'){
        if(!a.back){a.t+=16*dt;if(a.t>=a.bumpTo){a.t=a.bumpTo;a.back=true}}
        else{a.t-=10*dt;if(a.t<=0){a.t=0;a.state='idle'}}
      }
      if(a.flash>0)a.flash=Math.max(0,a.flash-dt*1.4);
    }
    const {cs,ox,oy}=view;ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--dot');
    for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++)if(G.mask[r*G.C+c]){
      ctx.beginPath();ctx.arc(ox+(c+.5)*cs,oy+(r+.5)*cs,Math.max(1.2,cs*0.05),0,6.283);ctx.fill();}
    for(const a of G.arrows)if(a.state!=='gone')drawArrow(a,now);
  }
  requestAnimationFrame(frame);
}
startLevel(save.current||1);
requestAnimationFrame(frame);
</script>
