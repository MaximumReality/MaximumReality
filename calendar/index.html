<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Daily Blueprint // Maximum Reality</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
/* ── SEASONAL TOKENS (overridden by JS) ── */
:root {
  --bg:         #05060d;
  --surface:    #0b0d18;
  --card:       #0f1120;
  --neon:       #00f0ff;
  --neon-rgb:   0,240,255;
  --pink:       #ff007f;
  --amber:      #ffb700;
  --dim:        #3a4060;
  --mid:        #6a7590;
  --text:       #dde8f0;
  --glow-c:     rgba(0,240,255,0.35);
  --glow-p:     rgba(255,0,127,0.35);
  --season-bg:  rgba(0,240,255,0.025);
  --corner-tint:rgba(0,240,255,0.06);
  --grid-line:  rgba(0,240,255,0.025);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  overscroll-behavior: none;
  transition: background 1.2s ease;
}

/* ── CRT scanlines ── */
body::before {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
  z-index: 999;
}

/* ── seasonal grid texture (color shifts with season) ── */
body::after {
  content: "";
  position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events: none;
  z-index: 0;
  transition: background-image 1.2s ease;
}

/* ── shell ── */
.shell {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 14px 36px;
}

/* ── masthead ── */
.masthead {
  width: 100%; max-width: 460px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--dim);
}
.masthead-left { display: flex; flex-direction: column; gap: 3px; }
.brand {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 4px; color: var(--neon);
  text-transform: uppercase; opacity: 0.7;
  transition: color 1.2s ease;
}
.clock {
  font-family: 'VT323', monospace;
  font-size: 2.1rem; line-height: 1;
  color: var(--neon);
  text-shadow: 0 0 12px var(--glow-c);
  letter-spacing: 2px;
  animation: clockFlicker 8s infinite;
  transition: color 1.2s ease, text-shadow 1.2s ease;
}
@keyframes clockFlicker {
  0%, 97%, 100% { opacity: 1; }
  98%           { opacity: 0.88; }
  99%           { opacity: 0.97; }
}
.date-line { font-size: 0.72rem; color: var(--mid); letter-spacing: 1px; }

/* ── season badge ── */
.season-badge {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.58rem; font-weight: 700;
  letter-spacing: 3px;
  color: var(--neon);
  opacity: 0.55;
  text-transform: uppercase;
  border: 1px solid var(--dim);
  border-radius: 4px;
  padding: 4px 8px;
  transition: color 1.2s ease, border-color 1.2s ease;
}

/* ── main card ── */
.card {
  width: 100%; max-width: 460px;
  background: var(--card);
  border: 1px solid var(--dim);
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  position: relative; overflow: hidden;
  transition: border-color 1.2s ease;
}
.card::before {
  content: "";
  position: absolute; top: 0; right: 0;
  width: 80px; height: 80px;
  background: linear-gradient(225deg, var(--corner-tint), transparent 60%);
  pointer-events: none;
  transition: background 1.2s ease;
}

/* ── month nav ── */
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.nav-btn {
  background: transparent;
  border: 1px solid var(--dim); border-radius: 6px;
  color: var(--neon); font-family: 'Share Tech Mono', monospace;
  font-size: 1rem; width: 34px; height: 34px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.nav-btn:active {
  background: rgba(var(--neon-rgb),0.12);
  border-color: var(--neon);
  box-shadow: 0 0 10px var(--glow-c);
}
@media (hover: hover) {
  .nav-btn:hover {
    background: rgba(var(--neon-rgb),0.1);
    border-color: var(--neon);
    box-shadow: 0 0 10px var(--glow-c);
  }
}
.month-year {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem; font-weight: 700;
  letter-spacing: 2px; color: var(--text);
  text-transform: uppercase;
}

/* ── motivation box ── */
.motive-box {
  background: var(--season-bg);
  border-left: 3px solid var(--neon);
  border-radius: 8px;
  padding: 14px 16px; margin-bottom: 18px;
  min-height: 92px;
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
  transition: background 1.2s ease, border-color 1.2s ease;
  position: relative; overflow: hidden;
  cursor: pointer;
}
/* subtle glitch shimmer on hover */
.motive-box::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 40%, rgba(var(--neon-rgb),0.04) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0s;
}
.motive-box:hover::after { transform: translateX(100%); transition: transform 0.6s ease; }

.motive-tag {
  font-size: 0.65rem; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--pink);
  font-weight: 700; transition: color 1.2s ease;
}
.motive-text {
  font-size: 0.88rem; line-height: 1.55;
  color: var(--text); font-style: italic;
  transition: opacity 0.22s ease, filter 0.22s ease;
}
.motive-text.hidden { opacity: 0; filter: blur(3px); }

/* special lore classes */
.motive-box.anomaly { border-left-color: var(--pink); background: rgba(255,0,127,0.05); }
.motive-box.anomaly .motive-tag { color: var(--neon); }
.motive-box.glitch-active .motive-text {
  animation: textGlitch 0.4s ease;
}
@keyframes textGlitch {
  0%   { transform: translate(0); clip-path: none; }
  20%  { transform: translate(-2px, 1px); }
  40%  { transform: translate(2px, -1px); clip-path: inset(20% 0 40% 0); }
  60%  { transform: translate(-1px, 2px); clip-path: inset(60% 0 10% 0); }
  80%  { transform: translate(1px, -2px); clip-path: none; }
  100% { transform: translate(0); }
}

/* ── journal note area (inside motive-box when expanded) ── */
.journal-area {
  margin-top: 10px;
  display: none;
  flex-direction: column;
  gap: 6px;
}
.journal-area.open { display: flex; }
.journal-textarea {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--dim);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.8rem;
  line-height: 1.4;
  padding: 8px 10px;
  resize: none;
  min-height: 60px;
  outline: none;
  transition: border-color 0.18s;
}
.journal-textarea:focus { border-color: var(--neon); }
.journal-actions {
  display: flex; gap: 6px; justify-content: flex-end; align-items: center;
}
.j-btn {
  background: transparent;
  border: 1px solid var(--dim);
  border-radius: 5px;
  color: var(--mid);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 1px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.j-btn.save { color: var(--neon); border-color: var(--dim); }
.j-btn.save:active, .j-btn.save:hover { border-color: var(--neon); background: rgba(var(--neon-rgb),0.08); }
.j-btn.mark { color: var(--amber); }
.j-btn.mark:active, .j-btn.mark:hover { border-color: var(--amber); background: rgba(255,183,0,0.08); }
.j-btn.clear-note { color: #ff6060; }
.mood-row {
  display: flex; gap: 5px; flex-wrap: wrap;
}
.mood-btn {
  background: transparent;
  border: 1px solid var(--dim);
  border-radius: 4px;
  font-size: 1rem;
  padding: 2px 6px;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  opacity: 0.6;
}
.mood-btn:active, .mood-btn.picked { opacity: 1; border-color: var(--neon); transform: scale(1.15); }
.journal-hint {
  font-size: 0.6rem; letter-spacing: 1.5px; color: var(--mid);
  text-transform: uppercase; opacity: 0.6; text-align: right;
  cursor: pointer;
}

/* ── weekday labels ── */
.wday-row {
  display: grid; grid-template-columns: repeat(7,1fr);
  text-align: center;
  font-size: 0.65rem; letter-spacing: 1px;
  color: var(--mid); text-transform: uppercase;
  margin-bottom: 8px;
}
.wday-row span:first-child,
.wday-row span:last-child { color: rgba(255,155,207,0.6); }

/* ── days grid ── */
.days-grid {
  display: grid; grid-template-columns: repeat(7,1fr);
  gap: 5px;
  transition: opacity 0.22s ease, transform 0.22s ease, filter 0.22s ease;
}
.days-grid.slide-out-left  { opacity: 0; transform: translateX(-18px); filter: blur(2px); }
.days-grid.slide-out-right { opacity: 0; transform: translateX(18px);  filter: blur(2px); }
.days-grid.slide-in        { opacity: 0; transform: translateX(0);     filter: blur(2px); }

.day {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.88rem;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.13s ease, background 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  user-select: none;
}
.day.empty { visibility: hidden; pointer-events: none; }
.day.weekend { color: #ff9bcf; }

/* touch-safe hover: only on real hover-capable devices */
@media (hover: hover) {
  .day:not(.empty):hover {
    transform: scale(1.1);
    background: rgba(255,255,255,0.05);
  }
}
.day:not(.empty):active { transform: scale(0.95); }

.day.today {
  background: var(--neon);
  color: #050810;
  font-weight: 700;
  font-family: 'Orbitron', sans-serif;
  animation: pulseDay 2.8s ease-in-out infinite;
  transition: background 1.2s ease;
}
@keyframes pulseDay {
  0%,100% { box-shadow: 0 0 8px  rgba(var(--neon-rgb),0.4); }
  50%     { box-shadow: 0 0 22px rgba(var(--neon-rgb),0.85), 0 0 40px rgba(var(--neon-rgb),0.3); }
}
.day.selected:not(.today) {
  border-color: var(--pink);
  color: var(--pink);
  font-weight: 600;
  box-shadow: 0 0 8px var(--glow-p);
}

/* dot = has saved note */
.day.has-note::after {
  content: "";
  position: absolute; bottom: 3px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--amber);
  opacity: 0.85;
}
/* ring = mission complete */
.day.complete::before {
  content: "";
  position: absolute; inset: 2px;
  border-radius: 6px;
  border: 1px solid rgba(var(--neon-rgb),0.5);
  pointer-events: none;
}

/* streak counter badge on today */
.streak-badge {
  position: absolute; top: -6px; right: -6px;
  background: var(--amber);
  color: #0a0800;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.5rem; font-weight: 700;
  border-radius: 8px;
  padding: 1px 4px;
  letter-spacing: 0;
  line-height: 1.4;
  display: none;
  z-index: 2;
}

/* ── status bar ── */
.statusbar {
  width: 100%; max-width: 460px;
  margin-top: 12px;
  display: flex; justify-content: space-between;
  font-size: 0.62rem; color: var(--dim);
  letter-spacing: 1px; text-transform: uppercase;
  padding: 0 2px;
}
.streak-info { color: var(--amber); display: none; }

/* ── toast notifications ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--card);
  border: 1px solid var(--neon);
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 0.75rem; letter-spacing: 1px;
  color: var(--neon);
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 1000;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 0 20px var(--glow-c);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell">

  <div class="masthead">
    <div class="masthead-left">
      <div class="brand">Maximum Reality // Daily Blueprint</div>
      <div id="clock" class="clock">00:00:00</div>
      <div id="dateLine" class="date-line"></div>
    </div>
    <div id="seasonBadge" class="season-badge"></div>
  </div>

  <div class="card">
    <div class="cal-header">
      <button class="nav-btn" id="prevBtn" aria-label="Previous month">&#8592;</button>
      <div id="monthYear" class="month-year"></div>
      <button class="nav-btn" id="nextBtn" aria-label="Next month">&#8594;</button>
    </div>

    <div class="motive-box" id="motiveBox">
      <div id="motiveTag" class="motive-tag">INITIALIZING...</div>
      <div id="motiveText" class="motive-text">Loading transmission...</div>

      <!-- Journal panel (hidden until tapped) -->
      <div class="journal-area" id="journalArea">
        <div class="mood-row" id="moodRow">
          <button class="mood-btn" data-mood="⚡">⚡</button>
          <button class="mood-btn" data-mood="🌊">🌊</button>
          <button class="mood-btn" data-mood="🔥">🔥</button>
          <button class="mood-btn" data-mood="🌑">🌑</button>
          <button class="mood-btn" data-mood="⚙️">⚙️</button>
          <button class="mood-btn" data-mood="✅">✅</button>
        </div>
        <textarea class="journal-textarea" id="journalInput" placeholder="// log entry..." rows="3"></textarea>
        <div class="journal-actions">
          <button class="j-btn clear-note" id="clearNoteBtn">ERASE</button>
          <button class="j-btn mark" id="markCompleteBtn">MISSION ✓</button>
          <button class="j-btn save" id="saveNoteBtn">SAVE LOG</button>
        </div>
      </div>
      <div class="journal-hint" id="journalHint">// TAP TO LOG</div>
    </div>

    <div class="wday-row">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
      <span>Thu</span><span>Fri</span><span>Sat</span>
    </div>

  </div>

  <div class="statusbar">
    <span id="dayCount"></span>
    <span id="streakInfo" class="streak-info"></span>
    <span>MR-CAL v3.0</span>
    <span id="weekNum"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

// ═══════════════════════════════════════════════════════

function getSeason(month) {
  // month = 1-12
  if ([12,1,2].includes(month)) return "winter";
  if ([3,4,5].includes(month)) return "spring";
  if ([6,7,8].includes(month)) return "summer";
  return "autumn";
}

function applySeasonalTheme(month) {
  const s = SEASONS[getSeason(month)];
  const r = document.documentElement.style;
  r.setProperty("--neon", s.neon);
  r.setProperty("--neon-rgb", s.neonRgb);
  r.setProperty("--pink", s.pink);
  r.setProperty("--amber", s.amber);
  r.setProperty("--dim", s.dim);
  r.setProperty("--mid", s.mid);
  r.setProperty("--season-bg", s.seasonBg);
  r.setProperty("--corner-tint", s.cornerTint);
  r.setProperty("--grid-line", s.gridLine);
  r.setProperty("--bg", s.bg);
  r.setProperty("--glow-c", `rgba(${s.neonRgb},0.35)`);
  document.body.style.background = s.bg;
  document.getElementById("seasonBadge").textContent = s.label;
}

function tickClock() {
  const n = new Date();
  const h = String(n.getHours()).padStart(2,"0");
  const m = String(n.getMinutes()).padStart(2,"0");
  const s = String(n.getSeconds()).padStart(2,"0");
  document.getElementById("clock").textContent = `${h}:${m}:${s}`;
}
setInterval(tickClock, 1000);
tickClock();

function updateDateLine() {
  const opts = { weekday:"long", month:"short", day:"numeric", year:"numeric" };
  document.getElementById("dateLine").textContent =
    "SYSTEM DATE: " + TODAY.toLocaleDateString("en-US", opts).toUpperCase();
}
updateDateLine();

//  PERSISTENCE HELPERS (localStorage)
// ═══════════════════════════════════════════════════════
function noteKey(m, d)    { return `mr_note_${m}_${d}`; }
function completeKey(m, d){ return `mr_done_${m}_${d}`; }
function moodKey(m, d)    { return `mr_mood_${m}_${d}`; }
const STREAK_KEY = "mr_streak_data";

function getNote(m, d)    { return localStorage.getItem(noteKey(m,d)) || ""; }
function isDone(m, d)     { return localStorage.getItem(completeKey(m,d)) === "1"; }
function getMood(m, d)    { return localStorage.getItem(moodKey(m,d)) || ""; }

function saveNote(m, d, text) {
  if (text.trim()) { localStorage.setItem(noteKey(m,d), text); }
  else { localStorage.removeItem(noteKey(m,d)); }
}
function toggleDone(m, d) {
  const was = isDone(m,d);
  if (was) { localStorage.removeItem(completeKey(m,d)); }
  else     { localStorage.setItem(completeKey(m,d), "1"); updateStreak(); }
  return !was;
}
function saveMood(m, d, emoji) {
  if (emoji) { localStorage.setItem(moodKey(m,d), emoji); }
  else       { localStorage.removeItem(moodKey(m,d)); }
}

// ── streak logic ──
function updateStreak() {
  const data = getStreakData();
  const todayStr = `${TODAY.getFullYear()}-${TODAY.getMonth()+1}-${TODAY.getDate()}`;
  if (!data.dates.includes(todayStr)) {
    data.dates.push(todayStr);
    localStorage.setItem(STREAK_KEY, JSON.stringify(data));
  }
  renderStreak();
}
function getStreakData() {
  try { return JSON.parse(localStorage.getItem(STREAK_KEY)) || { dates: [] }; }
  catch { return { dates: [] }; }
}
function calcStreak() {
  const data = getStreakData();
  if (!data.dates.length) return 0;
  const sorted = data.dates.slice().sort();
  let streak = 0;
  let check = new Date(TODAY);
  for (let i = 0; i < 365; i++) {
    const str = `${check.getFullYear()}-${check.getMonth()+1}-${check.getDate()}`;
    if (sorted.includes(str)) { streak++; check.setDate(check.getDate()-1); }
    else break;
  }
  return streak;
}
function renderStreak() {
  const s = calcStreak();
  const el = document.getElementById("streakInfo");
  if (s > 1) {
    el.textContent = `🔥 ${s}-DAY STREAK`;
    el.style.display = "block";
    const badge = document.querySelector(".streak-badge");
    if (badge) { badge.textContent = s; badge.style.display = "block"; }
  } else {
    el.style.display = "none";
  }
}

// ═══════════════════════════════════════════════════════
//  LORE / MOTIVATION
// ═══════════════════════════════════════════════════════
function getLoreText(m, d) {
  const key = `${m}-${d}`;
  const box = document.getElementById("motiveBox");

  // rare transmission override
  if (RARE_TRANSMISSIONS[key]) {
    box.classList.add("anomaly");
    let txt = RARE_TRANSMISSIONS[key];
    if (key === "12-31") {
      const now = new Date();
      const hrs = 23 - now.getHours();
      txt = txt.replace("{YEAR}", now.getFullYear()).replace("{HRS}", hrs);
    }
    return txt;
  }
  box.classList.remove("anomaly");
  return motivations[key] || "// TRANSMISSION PENDING // Signal logged. Execute with precision.";
}

function showMotivation(m, d, isToday) {
  const tag   = document.getElementById("motiveTag");
  const text  = document.getElementById("motiveText");
  const box   = document.getElementById("motiveBox");
  const key   = `${m}-${d}`;

  text.classList.add("hidden");

  setTimeout(() => {
    tag.textContent = isToday
      ? `TODAY'S PROTOCOL // ${MONTHS[m-1].toUpperCase()} ${d}`
      : `DAY INSIGHT // ${MONTHS[m-1].toUpperCase()} ${d}`;

    text.textContent = getLoreText(m, d);
    text.classList.remove("hidden");

    // glitch effect on anomaly/glitch dates
    if (GLITCH_DATES.has(key) || ANOMALY_DATES.has(key)) {
      box.classList.add("glitch-active");
      setTimeout(() => box.classList.remove("glitch-active"), 500);
    }
  }, 200);

  // restore journal
  loadJournalPanel(m, d);
}

// ═══════════════════════════════════════════════════════
//  JOURNAL PANEL
// ═══════════════════════════════════════════════════════
function loadJournalPanel(m, d) {
  const input = document.getElementById("journalInput");
  const hint  = document.getElementById("journalHint");
  const moodRow = document.getElementById("moodRow");

  input.value = getNote(m, d);

  // mood buttons
  const savedMood = getMood(m, d);
  moodRow.querySelectorAll(".mood-btn").forEach(btn => {
    btn.classList.toggle("picked", btn.dataset.mood === savedMood);
  });
  pendingMood = savedMood || null;

  // complete button label
  const markBtn = document.getElementById("markCompleteBtn");
  markBtn.textContent = isDone(m,d) ? "MISSION ✓✓" : "MISSION ✓";

  // hint text
  const hasData = getNote(m,d) || getMood(m,d) || isDone(m,d);
  hint.textContent = hasData ? "// LOGGED — TAP TO EDIT" : "// TAP TO LOG";

  // close journal if switching days
  if (journalOpen) { closeJournal(); }
}

function openJournal() {
  journalOpen = true;
  document.getElementById("journalArea").classList.add("open");
  document.getElementById("journalHint").style.display = "none";
  document.getElementById("journalInput").focus();
}
function closeJournal() {
  journalOpen = false;
  document.getElementById("journalArea").classList.remove("open");
  document.getElementById("journalHint").style.display = "block";
}

document.getElementById("motiveBox").addEventListener("click", (e) => {
  if (e.target.closest("#journalArea")) return;
  if (journalOpen) { closeJournal(); }
  else { openJournal(); }
});

document.getElementById("saveNoteBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const text = document.getElementById("journalInput").value;
  saveNote(activeMonth1, activeDay, text);
  if (pendingMood) saveMood(activeMonth1, activeDay, pendingMood);
  renderCalendar(null, true); // re-render dots without animation
  closeJournal();
  showToast("// LOG SAVED");
});

document.getElementById("markCompleteBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const now = toggleDone(activeMonth1, activeDay);
  e.currentTarget.textContent = now ? "MISSION ✓✓" : "MISSION ✓";
  renderCalendar(null, true);
  showToast(now ? "// MISSION COMPLETE ✓" : "// MISSION UNMARKED");
});

document.getElementById("clearNoteBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  localStorage.removeItem(noteKey(activeMonth1, activeDay));
  localStorage.removeItem(moodKey(activeMonth1, activeDay));
  document.getElementById("journalInput").value = "";
  document.getElementById("moodRow").querySelectorAll(".mood-btn")
    .forEach(b => b.classList.remove("picked"));
  pendingMood = null;
  renderCalendar(null, true);
  showToast("// LOG ERASED");
});

document.getElementById("moodRow").addEventListener("click", (e) => {
  e.stopPropagation();
  const btn = e.target.closest(".mood-btn");
  if (!btn) return;
  document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("picked"));
  if (pendingMood === btn.dataset.mood) {
    pendingMood = null;
  } else {
    btn.classList.add("picked");
    pendingMood = btn.dataset.mood;
  }
});

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

// ═══════════════════════════════════════════════════════
//  STATUS BAR
// ═══════════════════════════════════════════════════════
function getDayOfYear(d) {
  const s = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - s + (s.getTimezoneOffset() - d.getTimezoneOffset()) * 60000) / 86400000);
}
function getWeekNum(d) {
  const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  u.setUTCDate(u.getUTCDate() + 4 - (u.getUTCDay()||7));
  const y = new Date(Date.UTC(u.getUTCFullYear(),0,1));
  return Math.ceil((((u - y) / 86400000) + 1) / 7);
}
function updateStatusBar() {
  document.getElementById("dayCount").textContent = `DAY ${getDayOfYear(TODAY)} OF YEAR`;
  document.getElementById("weekNum").textContent  = `WEEK ${getWeekNum(TODAY)}`;
  renderStreak();
}
updateStatusBar();

// ═══════════════════════════════════════════════════════
//  CALENDAR RENDER
// ═══════════════════════════════════════════════════════
function renderCalendar(direction, silent) {
  const grid = document.getElementById("daysGrid");

  const doRender = () => {
    document.getElementById("monthYear").textContent =
      `${MONTHS[viewMonth]} ${viewYear}`;

    grid.innerHTML = "";

    const firstDow  = new Date(viewYear, viewMonth, 1).getDay();
    const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
    const isNow     = viewMonth === TODAY.getMonth() && viewYear === TODAY.getFullYear();
    const m1        = viewMonth + 1;

    for (let i = 0; i < firstDow; i++) {
      const e = document.createElement("div");
      e.className = "day empty";
      grid.appendChild(e);
    }

    for (let d = 1; d <= totalDays; d++) {
      const cell = document.createElement("div");
      cell.className = "day";
      cell.textContent = d;

      const dow = (firstDow + d - 1) % 7;
      if (dow === 0 || dow === 6) cell.classList.add("weekend");
      if (getNote(m1, d))  cell.classList.add("has-note");
      if (isDone(m1, d))   cell.classList.add("complete");

      if (isNow && d === TODAY.getDate()) {
        cell.classList.add("today");
        // streak badge
        const badge = document.createElement("span");
        badge.className = "streak-badge";
        const st = calcStreak();
        if (st > 1) { badge.textContent = st; badge.style.display = "block"; }
        cell.appendChild(badge);
      }

      if (isNow && d === activeDay && !(d === TODAY.getDate())) {
        cell.classList.add("selected");
      }

      cell.addEventListener("click", () => {
        document.querySelectorAll(".day").forEach(c => c.classList.remove("selected"));
        const isTd = isNow && d === TODAY.getDate();
        if (!isTd) cell.classList.add("selected");
        activeDay    = d;
        activeMonth1 = m1;
        showMotivation(m1, d, isTd);
      });

      grid.appendChild(cell);
    }

    // if navigated away from today's month, show the 1st by default
    if (!isNow) {
      activeDay    = 1;
      activeMonth1 = m1;
      showMotivation(m1, 1, false);
    } else {
      showMotivation(m1, TODAY.getDate(), true);
    }
  };

  if (silent || !direction) {
    doRender();
    return;
  }

  // ── animated transition ──
  const outClass = direction === "left" ? "slide-out-left" : "slide-out-right";
  grid.classList.add(outClass);

  setTimeout(() => {
    grid.classList.remove(outClass);
    grid.classList.add("slide-in");
    doRender();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        grid.classList.remove("slide-in");
      });
    });
  }, 230);
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
document.getElementById("prevBtn").addEventListener("click", () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  applySeasonalTheme(viewMonth + 1);
  renderCalendar("right");
});
document.getElementById("nextBtn").addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  applySeasonalTheme(viewMonth + 1);
  renderCalendar("left");
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
applySeasonalTheme(TODAY.getMonth() + 1);
renderCalendar(null, true);
</script>
