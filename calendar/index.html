<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Daily Blueprint // Maximum Reality</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #05060d;
  --surface:   #0b0d18;
  --card:      #0f1120;
  --neon:      #00f0ff;
  --pink:      #ff007f;
  --amber:     #ffb700;
  --dim:       #3a4060;
  --mid:       #6a7590;
  --text:      #dde8f0;
  --glow-c:    rgba(0,240,255,0.35);
  --glow-p:    rgba(255,0,127,0.35);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  overscroll-behavior: none;
}

/* ── CRT scanlines overlay ── */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
  pointer-events: none;
  z-index: 999;
}

/* ── grid texture ── */
body::after {
  content: "";
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events: none;
  z-index: 0;
}

/* ── outer layout ── */
.shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 14px 32px;
}

/* ── masthead ── */
.masthead {
  width: 100%;
  max-width: 460px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--dim);
}
.masthead-left { display: flex; flex-direction: column; gap: 3px; }
.brand {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--neon);
  text-transform: uppercase;
  opacity: 0.7;
}
.clock {
  font-family: 'VT323', monospace;
  font-size: 2.1rem;
  line-height: 1;
  color: var(--neon);
  text-shadow: 0 0 12px var(--glow-c);
  letter-spacing: 2px;
}
.date-line {
  font-size: 0.72rem;
  color: var(--mid);
  letter-spacing: 1px;
}

/* ── main card ── */
.card {
  width: 100%;
  max-width: 460px;
  background: var(--card);
  border: 1px solid var(--dim);
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  position: relative;
  overflow: hidden;
}
/* corner accent */
.card::before {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  background: linear-gradient(225deg, rgba(0,240,255,0.06), transparent 60%);
  pointer-events: none;
}

/* ── month nav header ── */
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.nav-btn {
  background: transparent;
  border: 1px solid var(--dim);
  border-radius: 6px;
  color: var(--neon);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1rem;
  width: 34px; height: 34px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn:hover, .nav-btn:active {
  background: rgba(0,240,255,0.1);
  border-color: var(--neon);
  box-shadow: 0 0 10px var(--glow-c);
}
.month-year {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text);
  text-transform: uppercase;
}

/* ── motivation box ── */
.motive-box {
  background: rgba(0,240,255,0.04);
  border-left: 3px solid var(--neon);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 18px;
  min-height: 88px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
}
.motive-tag {
  font-size: 0.65rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--pink);
  font-weight: 700;
}
.motive-text {
  font-size: 0.88rem;
  line-height: 1.55;
  color: var(--text);
  font-style: italic;
  transition: opacity 0.22s ease;
}

/* ── weekday labels ── */
.wday-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 0.65rem;
  letter-spacing: 1px;
  color: var(--mid);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.wday-row span:first-child,
.wday-row span:last-child { color: rgba(255,155,207,0.6); }

/* ── days grid ── */
.days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.88rem;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.13s ease, background 0.18s ease, box-shadow 0.18s ease;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.day.empty { visibility: hidden; pointer-events: none; }
.day.weekend { color: #ff9bcf; }
.day:not(.empty):hover { transform: scale(1.1); background: rgba(255,255,255,0.05); }

.day.today {
  background: var(--neon);
  color: #050810;
  font-weight: 700;
  font-family: 'Orbitron', sans-serif;
  animation: pulseDay 2.8s ease-in-out infinite;
}
@keyframes pulseDay {
  0%,100% { box-shadow: 0 0 8px var(--glow-c); }
  50%      { box-shadow: 0 0 22px rgba(0,240,255,0.8), 0 0 40px rgba(0,240,255,0.3); }
}

.day.selected:not(.today) {
  border-color: var(--pink);
  color: var(--pink);
  font-weight: 600;
  box-shadow: 0 0 8px var(--glow-p);
}

/* dot marker for days that have been "visited" */
.day.has-note::after {
  content: "";
  position: absolute;
  bottom: 3px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--amber);
  opacity: 0.7;
}

/* ── footer status bar ── */
.statusbar {
  width: 100%;
  max-width: 460px;
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  font-size: 0.62rem;
  color: var(--dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0 2px;
}
</style>
</head>

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const TODAY = new Date();
let viewMonth = TODAY.getMonth();   // 0-11
let viewYear  = TODAY.getFullYear();

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const DAYS_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WDAY_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// ─────────────────────────────────────────────
//  CLOCK
// ─────────────────────────────────────────────
function tickClock() {
  const n = new Date();
  const h = String(n.getHours()).padStart(2,"0");
  const m = String(n.getMinutes()).padStart(2,"0");
  const s = String(n.getSeconds()).padStart(2,"0");
  document.getElementById("clock").textContent = `${h}:${m}:${s}`;
}
setInterval(tickClock, 1000);
tickClock();

// ─────────────────────────────────────────────
//  DATE LINE
// ─────────────────────────────────────────────
function updateDateLine() {
  const opts = { weekday: "long", month: "short", day: "numeric", year: "numeric" };
  document.getElementById("dateLine").textContent =
    "SYSTEM DATE: " + TODAY.toLocaleDateString("en-US", opts).toUpperCase();
}
updateDateLine();

// ─────────────────────────────────────────────
//  MOTIVATION
// ─────────────────────────────────────────────
function getMotivation(month1, day) {
  return motivations[`${month1}-${day}`] ||
    "Execute with precision. Every day of the year holds a distinct signal.";
}

function showMotivation(month1, day, isToday) {
  const tag  = document.getElementById("motiveTag");
  const text = document.getElementById("motiveText");

  text.style.opacity = "0";

  setTimeout(() => {
    tag.textContent = isToday
      ? `TODAY'S PROTOCOL // ${MONTHS[month1-1].toUpperCase()} ${day}`
      : `DAY INSIGHT // ${MONTHS[month1-1].toUpperCase()} ${day}`;

    text.textContent = getMotivation(month1, day);
    text.style.opacity = "1";
  }, 180);
}

// ─────────────────────────────────────────────
//  STATUS BAR HELPERS
// ─────────────────────────────────────────────
function getDayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start + (start.getTimezoneOffset() - d.getTimezoneOffset()) * 60000;
  return Math.floor(diff / 86400000);
}

function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay()||7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

function updateStatusBar() {
  const doy = getDayOfYear(TODAY);
  const wk  = getWeekNumber(TODAY);
  document.getElementById("dayCount").textContent = `DAY ${doy} OF YEAR`;
  document.getElementById("weekNum").textContent  = `WEEK ${wk}`;
}
updateStatusBar();

// ─────────────────────────────────────────────
//  CALENDAR RENDER
// ─────────────────────────────────────────────
function renderCalendar() {
  document.getElementById("monthYear").textContent =
    `${MONTHS[viewMonth]} ${viewYear}`;

  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";

  const firstDow   = new Date(viewYear, viewMonth, 1).getDay();
  const totalDays  = new Date(viewYear, viewMonth + 1, 0).getDate();
  const isCurrentMonth =
    viewMonth === TODAY.getMonth() && viewYear === TODAY.getFullYear();

  // blank spacers
  for (let i = 0; i < firstDow; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    grid.appendChild(empty);
  }

  // day cells
  for (let d = 1; d <= totalDays; d++) {
    const cell = document.createElement("div");
    cell.className = "day";
    cell.textContent = d;

    const dow = (firstDow + d - 1) % 7;
    if (dow === 0 || dow === 6) cell.classList.add("weekend");

    if (isCurrentMonth && d === TODAY.getDate()) {
      cell.classList.add("today");
      showMotivation(viewMonth + 1, d, true);
    }

    cell.addEventListener("click", () => {
      document.querySelectorAll(".day").forEach(c => c.classList.remove("selected"));
      const isTd = isCurrentMonth && d === TODAY.getDate();
      if (!isTd) cell.classList.add("selected");
      showMotivation(viewMonth + 1, d, isTd);
    });

    grid.appendChild(cell);
  }

  // if viewing a month that's not current, show the month's first-day motivation
  if (!isCurrentMonth) {
    showMotivation(viewMonth + 1, 1, false);
  }
}

// ─────────────────────────────────────────────
//  NAVIGATION
// ─────────────────────────────────────────────
document.getElementById("prevBtn").addEventListener("click", () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
renderCalendar();
</script>
