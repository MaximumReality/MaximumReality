<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Blueprint Calendar</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161925;
            --accent-neon: #00f0ff;
            --accent-pink: #ff007f;
            --text-main: #f0f4f8;
            --text-dim: #8a95a5;
            --grid-border: #23283d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .calendar-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--grid-border);
        }

        /* Header Section */
        .calendar-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .month-year {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .current-day-label {
            font-size: 0.9rem;
            color: var(--accent-neon);
            margin-top: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Motivation Card */
        .motivation-card {
            background: rgba(0, 240, 255, 0.05);
            border-left: 4px solid var(--accent-neon);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .motivation-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent-pink);
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .motivation-text {
            font-size: 0.95rem;
            line-height: 1.4;
            font-style: italic;
            color: var(--text-main);
        }

        /* Calendar Grid */
        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .day:hover {
            background: rgba(250, 250, 250, 0.05);
        }

        .day.empty {
            pointer-events: none;
            visibility: hidden;
        }

        /* Highlight Current Active Date */
        .day.today {
            background: var(--accent-neon);
            color: var(--bg-color);
            font-weight: 700;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        /* Highlight Selected Date (when clicking around) */
        .day.selected:not(.today) {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <!-- Live Header -->
        <div class="calendar-header">
            <div id="monthYear" class="month-year"></div>
            <div id="currentDayLabel" class="current-day-label"></div>
        </div>

        <!-- Dynamic Motivation Box -->
        <div class="motivation-card">
            <div id="motivationTitle" class="motivation-title">Today's Protocol</div>
            <div id="motivationText" class="motivation-text">Loading daily calibration...</div>
        </div>

        <!-- Days of the Week Layout -->
        <div class="weekdays-grid">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <!-- Interactive Calendar Grid -->
        <div id="daysGrid" class="days-grid"></div>
    </div>

    <script>
        // Array of 31 unique, actionable insights linked to the day of the month
        const dailyMotivations = {
            1: "Fresh baseline established. Clear the logs, focus the lens, and execute the first play.",
            2: "Consistency isn't flash; it's the steady rhythm that outlasts the noise. Stay the course.",
            3: "Break the problem down into its smallest syntax. Solve the minor loop, win the major system.",
            4: "Velocity matters, but direction is paramount. Check your compass before hitting the throttle.",
            5: "Energy flows where attention is locked. Filter out the static and protect your focus.",
            6: "A rough draft beats an unwritten masterpiece every single time. Ship it and refine it.",
            7: "Rest is part of the engineering process, not an interruption. Recalibrate when needed.",
            8: "The best way to predict the outcome is to program it yourself. Take ownership of the interface.",
            9: "Simplicity is the ultimate sophistication. Strip away the excess variables today.",
            10: "Momentum builds block by block. Lay one perfect tile right now.",
            11: "Challenges are just unoptimized code waiting for a creative patch. Adjust your angle.",
            12: "Your current constraints are secret tools for innovation. Find the workaround.",
            13: "Great designs adapt to reality; they don't fight it. Ride the wave, pivot smoothly.",
            14: "Doubt is just rogue code running in the background. Terminate the process and focus on execution.",
            15: "Midpoint checkpoint. Look back at the ground covered, adjust your velocity for the next stretch.",
            16: "Action cures fear. If you are hesitating on a task, launch it within the next five minutes.",
            17: "Quiet execution speaks louder than loud announcements. Let the results do the talking.",
            18: "Clean spaces create clear thinking. Optimize your immediate environment today.",
            19: "You learn more from a bug that breaks than a system that glides. Value the glitches.",
            20: "Stay curious enough to ask the extra question. The best gold is hidden just beneath the surface.",
            21: "Focus on the process, and the numbers will look after themselves. Build the habit.",
            22: "In a world full of echoes, be an original transmission. Trust your specific style.",
            23: "Small wins accumulate compound interest. Don't look down on a minor step forward.",
            24: "Elevate your standards, lower your expectations of others, and execute flawlessly.",
            25: "Flexibility is strength. When the layout shifts, adapt your architecture without missing a beat.",
            26: "Mastery is just temporary failure repeated until it clicks. Keep iterating.",
            27: "Look at how far you've traveled from your starting point. The horizon is moving with you.",
            28: "Perfect conditions are a myth. True craft happens in the middle of chaotic environments.",
            29: "Keep your circle sharp, your goals clean, and your execution silent.",
            30: "Look at the big picture. One day of rain doesn't ruin the whole season's harvest.",
            31: "Cycle complete. Review your build, lock in the gains, and prepare for the next initialization."
        };

        function initializeCalendar() {
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth(); // 0-11
            const currentDate = today.getDate(); // 1-31

            // Format Month and Year Header
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthYear').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            
            // Format Live Today Tracker Label
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('currentDayLabel').innerText = `System Date: ${today.toLocaleDateString('en-US', options)}`;

            // Initial auto-load of today's motivation
            updateMotivation(currentDate, true);

            // Calculate Grid Variables
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay(); // Day of week the month starts on
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate(); // Total days in current month

            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = ''; // Clear out layout placeholders

            // Render Blank Spacers for previous month alignment
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('day', 'empty');
                daysGrid.appendChild(emptyDiv);
            }

            // Render Actual Calendar Days
            for (let day = 1; day <= totalDays; day++) {
                const daySquare = document.createElement('div');
                daySquare.classList.add('day');
                daySquare.innerText = day;

                // Highlight today automatically
                if (day === currentDate) {
                    daySquare.classList.add('today');
                }

                // Add interactive click behavior to read ahead or look back
                daySquare.addEventListener('click', () => {
                    // Remove temporary selections
                    document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
                    
                    if (day !== currentDate) {
                        daySquare.classList.add('selected');
                    }
                    
                    updateMotivation(day, day === currentDate);
                });

                daysGrid.appendChild(daySquare);
            }
        }

        function updateMotivation(dayNumber, isToday) {
            const textElement = document.getElementById('motivationText');
            const titleElement = document.getElementById('motivationTitle');
            
            // Fetch motivation text safely
            const message = dailyMotivations[dayNumber] || "Keep executing with precision and intent.";
            
            titleElement.innerText = isToday ? `Today's Protocol (Day ${dayNumber})` : `Day ${dayNumber} Insight`;
            textElement.innerText = message;
        }

        // Run on DOM Initialization
        window.addEventListener('DOMContentLoaded', initializeCalendar);
    </script>
</body>
</html>
