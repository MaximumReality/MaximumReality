<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AZUL | QUANTUM MAINFRAME</title>
    <style>
        /* AZUL THEME: CYBER BLUE & LOGIC */
        :root {
            --azul-blue: #2196f3;
            --bg-black: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            overflow: hidden; /* Prevents double scrolling on iPhone */
            display: flex;
            flex-direction: column;
        }

        /* Full Screen Header with Dynamic Island/Notch Support */
        .status-bar {
            background: var(--bg-black);
            color: var(--azul-blue);
            text-align: center;
            /* Optimized for iPhone 14 Pro Max Notch height */
            padding-top: env(safe-area-inset-top, 44px); 
            padding-bottom: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid #1a1a1a;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.15);
        }

        /* Expands to fill the remaining screen space */
        #mcontext {
            flex: 1;
            width: 100%;
            height: 100%;
            background: var(--bg-black);
        }

        /* Ensures the chat interface fills the entire container */
        #mcontext iframe {
            height: 100% !important;
            width: 100% !important;
            border: none;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        AZUL_OS v2.0.2 // SECURE_LINK
    </div>

    <div id="mcontext">
        <script 
            mode="embed" 
            isolate="true" 
            themecolor="#2196f3" 
            header="off" 
            accentcolor="#000000" 
            textcolor="white" 
            id="webchat" 
            src="https://cdn.machaao.com/prod/web/js/embed.js" 
            type="text/javascript" 
            mkey="MjA5ZmM0MDAtMjI1Mi0xMWYxLTgyYTMtNGRmYWZjOWI1NTA3">
        </script>
    </div>

</body>
</html>
