<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON RUSH - Expanded Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
body {
  background: #0a0a0f;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas {
  display: block;
  image-rendering: pixelated;
  border: 2px solid #ff00ff33;
  box-shadow: 0 0 30px #ff00ff22, 0 0 60px #00ffff11;
  max-width: 100%;
  max-height: 100vh;
}
#ui-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}
#start-screen, #gameover-screen {
  text-align: center;
  pointer-events: all;
  display: none;
  background: rgba(10, 10, 15, 0.85);
  padding: 30px;
  border: 1px solid #ff00ff55;
  box-shadow: 0 0 20px #ff00ff33;
}
#start-screen.active, #gameover-screen.active { display: block; }
h1 {
  font-size: 56px;
  color: #fff;
  text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
  letter-spacing: 6px;
  margin-bottom: 10px;
}
h2 {
  font-size: 28px;
  color: #00ffff;
  text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
  margin-bottom: 20px;
}
.subtitle {
  font-size: 16px;
  color: #ff66aa;
  text-shadow: 0 0 5px #ff66aa;
  margin-bottom: 25px;
}
.btn {
  background: transparent;
  border: 2px solid #00ffff;
  color: #00ffff;
  padding: 12px 36px;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 4px;
  transition: all 0.3s;
  text-shadow: 0 0 5px #00ffff;
  box-shadow: 0 0 10px #00ffff44, inset 0 0 10px #00ffff22;
}
.btn:hover {
  background: #00ffff22;
  box-shadow: 0 0 20px #00ffff88, inset 0 0 20px #00ffff44;
}
.final-score {
  font-size: 42px;
  color: #ffff00;
  text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
  margin: 15px 0;
}
.controls {
  font-size: 13px;
  color: #aaa;
  margin-top: 15px;
  line-height: 1.5;
}
.high-score {
  font-size: 18px;
  color: #ff00ff;
  text-shadow: 0 0 5px #ff00ff;
  margin: 10px 0;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-overlay">
  <div id="start-screen" class="active">
    <h1>NEON RUSH</h1>
    <p class="subtitle">⚡ OUTRUN THE VOID ⚡</p>
    <button class="btn" onclick="startGame()">START</button>
    <p class="controls">
      Desktop: SPACE / UP = Jump | DOWN = Slide<br>
      Mobile: Tap Right = Jump | Tap Left = Slide
    </p>
  </div>
  <div id="gameover-screen">
    <h2>GAME OVER</h2>
    <div class="final-score" id="final-score">0</div>
    <div class="high-score" id="high-score">BEST: 0</div>
    <button class="btn" onclick="startGame()">RETRY</button>
    <p class="controls">Press SPACE or tap to restart</p>
  </div>
</div>

<script>
// ============ CANVAS SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 500;
canvas.width = W;
canvas.height = H;

// ============ AUDIO ENGINE ============
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}
function playTone(freq, dur, type='square', vol=0.08, slide=0) {
  try {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

function sfxJump() { playTone(400, 0.15, 'square', 0.06, 400); }
function sfxDoubleJump() { playTone(600, 0.15, 'square', 0.06, 500); }
function sfxDie() { playTone(300, 0.4, 'sawtooth', 0.1, -250); }
function sfxScore() { playTone(880, 0.08, 'sine', 0.05); }
function sfxSlide() { playTone(150, 0.1, 'sawtooth', 0.04, -50); }
function sfxCoin() { playTone(1200, 0.1, 'sine', 0.06, 200); setTimeout(() => playTone(1600, 0.15, 'sine', 0.05), 80); }
function sfxPowerUp() { playTone(500, 0.2, 'triangle', 0.08, 600); }

// ============ GAME STATE ============
let state = 'menu';
let score, highScore = 0, speed, baseSpeed, frameCount;
let player, obstacles, particles, stars, coins, powerups, bgBuildings, groundTiles;
let screenShake = 0;
let comboTimer = 0;
let nearMissStreak = 0;

// ============ COLORS ============
const NEON = {
  cyan: '#00ffff',
  magenta: '#ff00ff',
  pink: '#ff44aa',
  green: '#44ff88',
  yellow: '#ffff44',
  orange: '#ff8844',
  blue: '#4488ff',
  white: '#ffffff'
};
const neonArr = [NEON.cyan, NEON.magenta, NEON.pink, NEON.green, NEON.yellow, NEON.orange, NEON.blue];
function randNeon() { return neonArr[Math.floor(Math.random() * neonArr.length)]; }

// ============ INIT ============
function init() {
  score = 0;
  speed = 0;
  baseSpeed = 5;
  frameCount = 0;
  screenShake = 0;
  comboTimer = 0;
  nearMissStreak = 0;

  player = {
    x: 120, y: 0, w: 32, h: 54,
    vy: 0, grounded: false, jumps: 0, maxJumps: 2,
    sliding: false, slideTimer: 0,
    trail: [], color: NEON.cyan, alive: true,
    groundY: H - 80,
    shield: false,
    dashTimer: 0
  };
  player.y = player.groundY - player.h;

  obstacles = [];
  particles = [];
  coins = [];
  powerups = [];

  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (H - 120),
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.1,
      brightness: Math.random()
    });
  }

  bgBuildings = [];
  for (let i = 0; i < 20; i++) {
    bgBuildings.push({
      x: i * 80 + Math.random() * 40,
      w: 30 + Math.random() * 50,
      h: 60 + Math.random() * 150,
      color: randNeon(),
      layer: Math.random() < 0.5 ? 0 : 1
    });
  }

  groundTiles = [];
  for (let i = 0; i < 25; i++) {
    groundTiles.push({ x: i * 40, glow: Math.random() });
  }
}

// ============ PARTICLES ============
function spawnParticles(x, y, count, color, spread=3, life=30) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * spread * 2,
      vy: (Math.random() - 0.5) * spread * 2,
      life: life + Math.random() * 15,
      maxLife: life + 15,
      size: Math.random() * 3 + 1,
      color
    });
  }
}

function spawnTrail() {
  if (frameCount % 2 === 0) {
    player.trail.push({
      x: player.x, y: player.y + (player.sliding ? 25 : 0),
      w: player.w, h: player.sliding ? 25 : player.h,
      life: 12,
      color: player.dashTimer > 0 ? NEON.magenta : player.color
    });
  }
}

// ============ OBSTACLES & POWERUPS ============
function spawnObstacle() {
  const type = Math.random();
  const groundY = H - 80;

  if (type < 0.3) {
    const h = 30 + Math.random() * 30;
    obstacles.push({
      x: W + 50, y: groundY - h, w: 20 + Math.random() * 15, h,
      color: NEON.magenta, type: 'barrier'
    });
  } else if (type < 0.55) {
    const h = 50 + Math.random() * 40;
    obstacles.push({
      x: W + 50, y: groundY - h, w: 15, h,
      color: NEON.pink, type: 'spike'
    });
  } else if (type < 0.75) {
    obstacles.push({
      x: W + 50, y: groundY - 80 - Math.random() * 30, w: 60 + Math.random() * 40, h: 15,
      color: NEON.orange, type: 'beam'
    });
  } else if (type < 0.9) {
    const h1 = 25;
    obstacles.push({
      x: W + 50, y: groundY - h1, w: 25, h: h1,
      color: NEON.magenta, type: 'barrier'
    });
    obstacles.push({
      x: W + 90, y: groundY - 55, w: 25, h: 55,
      color: NEON.pink, type: 'spike'
    });
  } else {
    obstacles.push({
      x: W + 50, y: groundY - 25, w: 80 + Math.random() * 40, h: 25,
      color: NEON.orange, type: 'barrier'
    });
  }

  if (Math.random() < 0.4) {
    coins.push({
      x: W + 50 + Math.random() * 100,
      y: groundY - 60 - Math.random() * 80,
      size: 10, collected: false,
      color: NEON.yellow, angle: 0
    });
  } else if (Math.random() < 0.1) {
    const pType = Math.random() < 0.5 ? 'shield' : 'dash';
    powerups.push({
      x: W + 60, y: groundY - 70 - Math.random() * 50,
      size: 14, type: pType,
      color: pType === 'shield' ? NEON.cyan : NEON.magenta
    });
  }
}

// ============ INPUT HANDLING ============
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    handleJumpInput();
  }
  if (e.code === 'ArrowDown') {
    e.preventDefault();
    handleSlideInput();
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const touchX = touch.clientX - rect.left;

  if (touchX < rect.width / 2) {
    handleSlideInput();
  } else {
    handleJumpInput();
  }
});

function handleJumpInput() {
  if (state === 'menu' || state === 'dead') startGame();
  else if (state === 'playing') jump();
}

function handleSlideInput() {
  if (state === 'playing') slide();
}

function jump() {
  if (!player.alive) return;
  if (player.sliding) {
    player.sliding = false;
    player.slideTimer = 0;
    player.h = 54;
    player.y = player.groundY - player.h;
  }
  if (player.jumps < player.maxJumps) {
    player.vy = player.jumps === 0 ? -12 : -10;
    player.jumps++;
    player.grounded = false;
    if (player.jumps === 1) {
      sfxJump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, 8, NEON.cyan, 3);
    } else {
      sfxDoubleJump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, 12, NEON.green, 4);
    }
  }
}

function slide() {
  if (!player.alive || !player.grounded || player.sliding) return;
  player.sliding = true;
  player.slideTimer = 30;
  player.h = 26;
  player.y = player.groundY - player.h;
  sfxSlide();
  spawnParticles(player.x + player.w, player.y + player.h, 6, NEON.cyan, 2);
}

// ============ GAME FLOW ============
function startGame() {
  ensureAudio();
  init();
  state = 'playing';
  document.getElementById('start-screen').classList.remove('active');
  document.getElementById('gameover-screen').classList.remove('active');
}

function die() {
  if (!player.alive) return;

  if (player.shield) {
    player.shield = false;
    sfxPowerUp();
    screenShake = 10;
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 25, NEON.cyan, 5, 30);
    return;
  }

  if (player.dashTimer > 0) return;

  player.alive = false;
  state = 'dead';
  sfxDie();
  screenShake = 15;
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 40, NEON.cyan, 6, 50);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 30, NEON.magenta, 8, 50);

  if (score > highScore) highScore = score;
  setTimeout(() => {
    document.getElementById('final-score').textContent = Math.floor(score);
    document.getElementById('high-score').textContent = 'BEST: ' + Math.floor(highScore);
    document.getElementById('gameover-screen').classList.add('active');
  }, 800);
}

// ============ UPDATE LOOP ============
function update() {
  if (state !== 'playing' && state !== 'dead') return;

  frameCount++;
  if (state === 'playing') {
    speed = (baseSpeed + Math.floor(score / 100) * 0.5) * (player.dashTimer > 0 ? 1.4 : 1);
    if (speed > 16) speed = 16;
    score += speed * 0.05;
  }

  if (screenShake > 0) screenShake *= 0.85;

  if (player.alive) {
    player.vy += 0.6;
    player.y += player.vy;
    if (player.y >= player.groundY - player.h) {
      player.y = player.groundY - player.h;
      player.vy = 0;
      player.grounded = true;
      player.jumps = 0;
    } else {
      player.grounded = false;
    }

    if (player.sliding) {
      player.slideTimer--;
      if (player.slideTimer <= 0) {
        player.sliding = false;
        player.h = 54;
        player.y = player.groundY - player.h;
      }
    }

    if (player.dashTimer > 0) player.dashTimer--;

    spawnTrail();
    comboTimer = Math.max(0, comboTimer - 1);
  }

  player.trail = player.trail.filter(t => { t.life--; return t.life > 0; });

  if (state === 'playing') {
    const spawnRate = Math.max(35, 90 - Math.floor(score / 50) * 3);
    if (frameCount % spawnRate === 0) spawnObstacle();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;

    if (player.alive && !o.scored) {
      const dx = o.x - (player.x + player.w);
      if (dx > -5 && dx < 15 && Math.abs((o.y + o.h / 2) - (player.y + player.h / 2)) < o.h / 2 + player.h / 2 + 20) {
        o.nearMiss = true;
      }
      if (o.x + o.w < player.x) {
        o.scored = true;
        if (o.nearMiss) {
          nearMissStreak++;
          comboTimer = 60;
          score += 5 * nearMissStreak;
          spawnParticles(player.x + player.w / 2, player.y, 10, NEON.yellow, 3, 20);
          if (nearMissStreak > 1) sfxScore();
        }
      }
    }

    if (player.alive && rectCollide(player, o)) {
      if (player.dashTimer > 0) {
        obstacles.splice(i, 1);
        spawnParticles(o.x + o.w/2, o.y + o.h/2, 20, o.color, 5, 20);
        continue;
      } else {
        die();
      }
    }

    if (o.x + o.w < -50) obstacles.splice(i, 1);
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.x -= speed;
    c.angle += 0.08;

    if (player.dashTimer > 0) {
      c.x += ((player.x + player.w/2) - c.x) * 0.15;
      c.y += ((player.y + player.h/2) - c.y) * 0.15;
    }

    if (!c.collected && player.alive) {
      const dx = (player.x + player.w / 2) - c.x;
      const dy = (player.y + player.h / 2) - c.y;
      if (Math.sqrt(dx * dx + dy * dy) < c.size + 20) {
        c.collected = true;
        score += 25;
        sfxCoin();
        spawnParticles(c.x, c.y, 15, NEON.yellow, 4, 25);
      }
    }
    if (c.x < -50 || c.collected) coins.splice(i, 1);
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.x -= speed;
    if (player.alive && Math.abs((player.x + player.w/2) - p.x) < 30 && Math.abs((player.y + player.h/2) - p.y) < 30) {
      sfxPowerUp();
      if (p.type === 'shield') player.shield = true;
      if (p.type === 'dash') player.dashTimer = 180;
      spawnParticles(p.x, p.y, 20, p.color, 4, 30);
      powerups.splice(i, 1);
      continue;
    }
    if (p.x < -50) powerups.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (const s of stars) {
    s.x -= s.speed * (speed / baseSpeed);
    s.brightness = 0.3 + Math.sin(frameCount * 0.03 + s.x) * 0.3;
    if (s.x < -5) { s.x = W + 5; s.y = Math.random() * (H - 120); }
  }

  for (const b of bgBuildings) {
    const spd = b.layer === 0 ? speed * 0.15 : speed * 0.3;
    b.x -= spd;
    if (b.x + b.w < -10) {
      b.x = W + Math.random() * 100;
      b.h = 60 + Math.random() * 150;
      b.w = 30 + Math.random() * 50;
      b.color = randNeon();
    }
  }

  for (const g of groundTiles) {
    g.x -= speed;
    g.glow = 0.3 + Math.sin(frameCount * 0.05 + g.x * 0.1) * 0.3;
    if (g.x + 40 < 0) { g.x += 25 * 40; g.glow = Math.random(); }
  }
}

function rectCollide(a, b) {
  const shrink = 4;
  return a.x + shrink < b.x + b.w &&
         a.x + a.w - shrink > b.x &&
         a.y + shrink < b.y + b.h &&
         a.y + a.h - shrink > b.y;
}

// ============ RENDER ============
function draw() {
  ctx.save();

  if (screenShake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake * 2,
      (Math.random() - 0.5) * screenShake * 2
    );
  }

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050510');
  grad.addColorStop(0.6, '#0a0a20');
  grad.addColorStop(1, '#120a25');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = 0.3 + s.brightness * 0.7;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  for (const b of bgBuildings) {
    ctx.globalAlpha = b.layer === 0 ? 0.12 : 0.2;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, H - 80 - b.h * (b.layer === 0 ? 0.6 : 0.4), b.w, b.h * (b.layer === 0 ? 0.6 : 0.4));
  }
  ctx.globalAlpha = 1;

  const groundY = H - 80;
  ctx.strokeStyle = NEON.magenta + '44';
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

  ctx.globalAlpha = 0.1;
  ctx.strokeStyle = NEON.cyan;
  const gridOffset = (frameCount * speed * 0.5) % 40;
  for (let x = -gridOffset; x < W + 40; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  drawGlowLine(0, groundY, W, groundY, NEON.cyan, 2, 8);

  for (const c of coins) drawCoin(c);
  for (const p of powerups) drawPowerup(p);
  for (const o of obstacles) drawObstacle(o);

  for (const t of player.trail) {
    ctx.globalAlpha = (t.life / 12) * 0.4;
    ctx.fillStyle = t.color || player.color;
    ctx.fillRect(t.x, t.y, t.w, t.h);
  }
  ctx.globalAlpha = 1;

  if (player.alive || frameCount % 6 < 3) drawPlayer();

  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  drawHUD();

  ctx.fillStyle = 'rgba(18, 10, 37, 0.04)';
  for (let i = 0; i < H; i += 4) ctx.fillRect(0, i, W, 2);

  ctx.restore();
}

function drawGlowLine(x1, y1, x2, y2, color, width, glow) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

// ============ NEW CHARACTER RENDERER ============
function drawPlayer() {
  const px = player.x, py = player.y, pw = player.w, ph = player.h;
  const c = player.dashTimer > 0 ? NEON.magenta : player.color;

  ctx.save();
  ctx.shadowColor = c;
  ctx.shadowBlur = 12;
  ctx.strokeStyle = c;
  ctx.fillStyle = c;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  const runPhase = frameCount * 0.35;

  if (!player.sliding) {
    // --- Head / Helmet ---
    const headX = px + pw / 2 + 2;
    const headY = py + 10;
    ctx.beginPath();
    ctx.arc(headX, headY, 8, 0, Math.PI * 2);
    ctx.fill();

    // Glowing Visor
    ctx.fillStyle = NEON.yellow;
    ctx.shadowColor = NEON.yellow;
    ctx.fillRect(headX + 2, headY - 3, 7, 4);

    // --- Cyber Scarf / Cape ---
    ctx.strokeStyle = NEON.magenta;
    ctx.shadowColor = NEON.magenta;
    ctx.beginPath();
    ctx.moveTo(headX - 4, headY + 2);
    const scarfWave = Math.sin(frameCount * 0.4) * 6;
    ctx.quadraticCurveTo(headX - 16, headY + scarfWave, headX - 26, headY + scarfWave * 1.5);
    ctx.stroke();

    // --- Torso / Armor ---
    ctx.strokeStyle = c;
    ctx.shadowColor = c;
    const neckY = headY + 8;
    const hipY = py + ph - 20;
    const spineX = px + pw / 2;

    ctx.beginPath();
    ctx.moveTo(neckY < hipY ? spineX : spineX, neckY);
    ctx.lineTo(spineX - 2, hipY);
    ctx.stroke();

    // Chest Plate Core
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(spineX - 6, neckY, 12, 12);
    ctx.strokeRect(spineX - 6, neckY, 12, 12);

    // --- Arms & Running Animation ---
    const armAngle1 = player.grounded ? Math.sin(runPhase) * 0.8 : -0.5;
    const armAngle2 = player.grounded ? Math.sin(runPhase + Math.PI) * 0.8 : 0.8;

    // Back Arm
    ctx.beginPath();
    ctx.moveTo(spineX, neckY + 2);
    ctx.lineTo(spineX - 10 * Math.cos(armAngle2), neckY + 10 + 8 * Math.sin(armAngle2));
    ctx.stroke();

    // Front Arm
    ctx.beginPath();
    ctx.moveTo(spineX, neckY + 2);
    ctx.lineTo(spineX + 10 * Math.cos(armAngle1), neckY + 10 + 8 * Math.sin(armAngle1));
    ctx.stroke();

    // --- Legs & Running Animation ---
    const legAngle1 = player.grounded ? Math.sin(runPhase) * 1.0 : -0.8;
    const legAngle2 = player.grounded ? Math.sin(runPhase + Math.PI) * 1.0 : 0.6;

    // Leg 1
    ctx.beginPath();
    ctx.moveTo(spineX - 2, hipY);
    const knee1X = spineX - 2 + 12 * Math.sin(legAngle1);
    const knee1Y = hipY + 12 * Math.cos(legAngle1);
    ctx.lineTo(knee1X, knee1Y);
    ctx.lineTo(knee1X + 8 * Math.sin(legAngle1 + 0.4), knee1Y + 10);
    ctx.stroke();

    // Leg 2
    ctx.beginPath();
    ctx.moveTo(spineX - 2, hipY);
    const knee2X = spineX - 2 + 12 * Math.sin(legAngle2);
    const knee2Y = hipY + 12 * Math.cos(legAngle2);
    ctx.lineTo(knee2X, knee2Y);
    ctx.lineTo(knee2X + 8 * Math.sin(legAngle2 + 0.4), knee2Y + 10);
    ctx.stroke();

  } else {
    // --- Slide Pose ---
    const slideHeadX = px + pw - 8;
    const slideHeadY = py + 10;

    // Head/Visor
    ctx.beginPath();
    ctx.arc(slideHeadX, slideHeadY, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = NEON.yellow;
    ctx.fillRect(slideHeadX, slideHeadY - 2, 6, 3);

    // Torso lying low
    ctx.strokeStyle = c;
    ctx.beginPath();
    ctx.moveTo(slideHeadX - 7, slideHeadY + 2);
    ctx.lineTo(px + 6, py + ph - 6);
    ctx.stroke();

    // Scarf trailing horizontal
    ctx.strokeStyle = NEON.magenta;
    ctx.beginPath();
    ctx.moveTo(slideHeadX - 10, slideHeadY - 2);
    ctx.lineTo(slideHeadX - 30, slideHeadY - 4 + Math.sin(frameCount) * 3);
    ctx.stroke();

    // Sliding Sparks
    if (frameCount % 2 === 0) {
      spawnParticles(px + pw, py + ph, 2, NEON.yellow, 2, 10);
    }
  }

  // --- Shield Visual Bubble ---
  if (player.shield) {
    ctx.strokeStyle = NEON.cyan;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px + pw/2, py + ph/2, 36, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawObstacle(o) {
  ctx.save();
  ctx.shadowColor = o.color;
  ctx.shadowBlur = 12;

  if (o.type === 'spike') {
    ctx.fillStyle = o.color;
    ctx.beginPath();
    ctx.moveTo(o.x + o.w / 2, o.y);
    ctx.lineTo(o.x + o.w, o.y + o.h);
    ctx.lineTo(o.x, o.y + o.h);
    ctx.fill();
  } else {
    ctx.fillStyle = '#111';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = o.color;
    ctx.lineWidth = 2;
    ctx.strokeRect(o.x, o.y, o.w, o.h);
  }
  ctx.restore();
}

function drawCoin(c) {
  ctx.save();
  ctx.shadowColor = c.color;
  ctx.shadowBlur = 10;
  ctx.fillStyle = c.color;
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.size * Math.abs(Math.cos(c.angle)), c.size, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPowerup(p) {
  ctx.save();
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 15;
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.font = 'bold 24px "Courier New"';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = NEON.cyan;
  ctx.shadowBlur = 10;
  ctx.textAlign = 'right';
  ctx.fillText(Math.floor(score).toString().padStart(6, '0'), W - 20, 35);

  ctx.font = '14px "Courier New"';
  ctx.fillStyle = NEON.magenta;
  ctx.fillText('SPD ' + speed.toFixed(1), W - 20, 55);

  if (player.shield) {
    ctx.textAlign = 'left';
    ctx.fillStyle = NEON.cyan;
    ctx.fillText('🛡️ SHIELD ACTIVE', 20, 60);
  }

  if (player.dashTimer > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = NEON.magenta;
    ctx.fillText('⚡ DASH MODE!', 20, 80);
  }

  ctx.restore();
}

// ============ LOOP ============
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

init();
gameLoop();
</script>
