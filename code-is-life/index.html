<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CODE IS LIFE — Maximum Reality</title>
<style>
  :root{
    --bg: #04060a;
    --line: #1c2438;
    --ink: #e7edf7;
    --dim: #6f7891;
    --cyan: #35f0c9;
    --pink: #ff3d81;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .app{
    position:relative;
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .tag-pill{
    margin-top:22px;
    padding:10px 22px;
    border-radius:999px;
    border:1px solid #3a2b4a;
    background:#0c0e16;
    color:var(--cyan);
    font-weight:700;
    letter-spacing:0.15em;
    font-size:0.95rem;
    text-shadow:0 0 12px currentColor;
    box-shadow:0 0 22px -4px var(--pink);
    outline:none;
    text-align:center;
    min-width:180px;
  }
  .tag-pill::selection{background:#35f0c955;}
  .status-line{
    margin-top:14px;
    color:var(--dim);
    font-size:0.7rem;
    letter-spacing:0.25em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .status-line .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--dim);
    display:inline-block;
  }
  .status-line.active .dot{background:var(--cyan); box-shadow:0 0 6px var(--cyan);}
  .canvas-wrap{
    position:relative;
    flex:1;
    width:100%;
    max-width:600px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .wordmark{
    color:var(--dim);
    font-size:0.72rem;
    letter-spacing:0.5em;
    padding:10px 0 4px;
    border-top:1px solid var(--line);
    width:70%;
    max-width:320px;
    text-align:center;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 20px calc(22px + env(safe-area-inset-bottom));
  }
  .circle-btn{
    width:52px;height:52px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#0c0e16;
    color:var(--ink);
    font-size:1.1rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .circle-btn:disabled{opacity:0.3;}
  .chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 16px;
    height:44px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#0c0e16;
    color:var(--ink);
    font-size:0.75rem;
    letter-spacing:0.1em;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip .plus{
    width:18px;height:18px;
    border-radius:50%;
    background:var(--pink);
    color:#1a0210;
    display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;
    font-weight:700;
  }
  .pill-btn{
    flex:1;
    height:44px;
    border-radius:999px;
    border:1px solid var(--cyan);
    background:transparent;
    color:var(--cyan);
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.15em;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    gap:8px;
    white-space:nowrap;
  }
  .pill-btn .rec-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--pink);
  }
  .pill-btn.recording{
    animation:pulse 1s infinite;
    border-color:var(--pink);
    color:var(--pink);
  }
  .pill-btn:disabled{opacity:0.35;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
  .status-note{
    position:absolute;
    bottom:calc(78px + env(safe-area-inset-bottom));
    left:0; right:0;
    text-align:center;
    color:var(--dim);
    font-size:0.62rem;
    letter-spacing:0.04em;
    padding:0 24px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="tag-pill" id="tagPill" contenteditable="true" spellcheck="false">LORI · LORI</div>
  <div class="status-line" id="statusLine">
    <span class="dot"></span><span id="statusWord">READY</span>
    <span class="dot"></span><span id="statusTag" contenteditable="true" spellcheck="false">THROUGH THE SCREEN</span>
  </div>

  <div class="canvas-wrap">
    <canvas id="viz" width="540" height="960"></canvas>
  </div>

  <div class="wordmark">MAXIMUM REALITY</div>
  <div class="status-note" id="note">Load your mp3, then hit play — visual reacts to actual frequency data.</div>

  <div class="controls">
    <button id="playBtn" class="circle-btn" disabled>▶</button>
    <label class="chip" for="fileInput">MP3 <span class="plus">+</span></label>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac" hidden>
    <button id="recBtn" class="pill-btn" disabled><span class="rec-dot"></span>REC · WEBM</button>
  </div>
</div>

<script>
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const playBtn = document.getElementById('playBtn');
const recBtn = document.getElementById('recBtn');
const statusWord = document.getElementById('statusWord');
const statusLine = document.getElementById('statusLine');
const note = document.getElementById('note');
const titleLines = ['CODE IS','LIFE'];

let audio, audioCtx, analyser, data, raf, isPlaying = false;

// ---- constellation field: fixed random nodes, connected by proximity ----
const NODES = 46;
const nodes = Array.from({length: NODES}, () => ({
  x: Math.random()*540,
  y: Math.random()*960,
  vx: (Math.random()-0.5)*0.15,
  vy: (Math.random()-0.5)*0.15,
  seed: Math.random()*1000
}));

function hexRgb(h){ const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const CYAN = hexRgb('35f0c9'), PINK = hexRgb('ff3d81');

async function setupAudio(url, label){
  if(audio){ audio.pause(); }
  audio = new Audio(url);
  audio.crossOrigin = "anonymous";
  audio.loop = true;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') await audioCtx.resume();
  const src = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  data = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);

  playBtn.disabled = false;
  recBtn.disabled = false;
  statusWord.textContent = 'LOADED';
  note.textContent = label + ' — hit play, scrub isn\'t needed, it loops.';
  if(!raf) drawIdle();
}

fileInput.addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  setupAudio(URL.createObjectURL(f), f.name);
});

async function startPlayback(){
  if(!audio) return false;
  if(audioCtx.state === 'suspended') await audioCtx.resume();
  if(!isPlaying){
    await audio.play();
    isPlaying = true;
    playBtn.textContent = '❚❚';
    statusWord.textContent = 'PLAYING';
    statusLine.classList.add('active');
    draw();
  }
  return true;
}

playBtn.addEventListener('click', async ()=>{
  if(!audio) return;
  if(!isPlaying){
    await startPlayback();
  } else {
    audio.pause();
    isPlaying = false;
    playBtn.textContent = '▶';
    statusWord.textContent = 'PAUSED';
    statusLine.classList.remove('active');
    cancelAnimationFrame(raf);
  }
});

function updateNodes(){
  for(const n of nodes){
    n.x += n.vx; n.y += n.vy;
    if(n.x<0||n.x>540) n.vx*=-1;
    if(n.y<0||n.y>960) n.vy*=-1;
  }
}

function renderScene(avg, bass){
  const w=canvas.width, h=canvas.height, cx=w/2, cy=h/2;

  ctx.fillStyle = 'rgba(4,6,10,0.32)';
  ctx.fillRect(0,0,w,h);

  updateNodes();

  // constellation lines between nearby nodes
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<130){
        ctx.strokeStyle = `rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},${0.12*(1-dist/130)})`;
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke();
      }
    }
  }

  // long radiating lines from center, reactive to bass
  ctx.lineWidth=1;
  for(let i=0;i<7;i++){
    const ang = (i/7)*Math.PI*2 + performance.now()*0.00005;
    ctx.strokeStyle = `rgba(${PINK[0]},${PINK[1]},${PINK[2]},0.10)`;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(ang)*(260+bass), cy+Math.sin(ang)*(360+bass));
    ctx.stroke();
  }

  // particle dots, alternating cyan/pink, pulsing with frequency bins
  nodes.forEach((n,i)=>{
    const v = data ? data[i % data.length] : (40+Math.sin(n.seed+performance.now()*0.001)*20);
    const c = i%2===0 ? CYAN : PINK;
    const r = 1.4 + v/90;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.35+v/320})`;
    ctx.fill();
  });

  // center glow burst
  const glowR = 70 + avg*0.6;
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);
  grad.addColorStop(0, `rgba(255,255,255,${0.35+avg/500})`);
  grad.addColorStop(0.35, `rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0.28)`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2); ctx.fill();

  // glitch-style title: cyan/pink offset copies + white top layer
  ctx.textAlign = 'center';
  ctx.font = "700 58px ui-monospace, monospace";
  const lineH = 62;
  const startY = cy - (titleLines.length-1)*lineH/2;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  titleLines.forEach((line, li)=>{
    const y = startY + li*lineH;
    ctx.fillStyle = `rgba(${PINK[0]},${PINK[1]},${PINK[2]},0.9)`;
    ctx.fillText(line, cx-3, y+3);
    ctx.fillStyle = `rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0.9)`;
    ctx.fillText(line, cx+3, y-3);
  });
  ctx.restore();

  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#ffffff';
  titleLines.forEach((line, li)=>{
    ctx.fillText(line, cx, startY + li*lineH);
  });
  ctx.shadowBlur = 0;
}

function draw(){
  raf = requestAnimationFrame(draw);
  analyser.getByteFrequencyData(data);
  let avg=0; for(let i=0;i<data.length;i++) avg+=data[i]; avg/=data.length;
  const bass = (data[1]+data[2]+data[3])/3;
  renderScene(avg, bass);
}

function drawIdle(){
  raf = requestAnimationFrame(drawIdle);
  renderScene(30, 20);
}
drawIdle();

recBtn.addEventListener('click', async ()=>{
  const started = await startPlayback();
  if(!started){ note.textContent = 'Load a song first.'; return; }

  const stream = canvas.captureStream(30);
  const candidates = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime = candidates.find(t=>MediaRecorder.isTypeSupported(t)) || 'video/webm';

  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{
    const blob = new Blob(chunks, {type:'video/webm'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'code-is-life-loop.webm'; a.click();
    statusWord.textContent = 'DONE';
    note.textContent = 'Downloaded .webm — convert: ffmpeg -i code-is-life-loop.webm -c:v libx264 -pix_fmt yuv420p out.mp4';
    recBtn.classList.remove('recording');
    recBtn.disabled = false;
  };

  rec.start();
  recBtn.classList.add('recording');
  recBtn.disabled = true;
  statusWord.textContent = 'REC';
  note.textContent = 'Recording 6s loop…';
  setTimeout(()=> rec.stop(), 6000);
});
</script>
</body>
</html>
