<title>Luna's Dino Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-screen 3D valley, title floating top-left, fact card + dino buttons floating at the bottom */
:root{
  --sky:#8fd3e8; --ink:#2b2118; --paper:#fff8e8; --lava:#f26a2a; --moss:#3a5a1f; --onlava:#ffffff;
  --display:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,48px);margin:0;color:var(--paper);line-height:1;text-shadow:0 3px 0 var(--moss),0 7px 14px rgba(0,0,0,.25);text-wrap:balance}
.bottom{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.fact{pointer-events:auto;width:100%;max-width:520px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:600;font-size:16px;line-height:1.35;box-shadow:0 4px 0 var(--ink)}
.fact b{display:block;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.01em;margin-bottom:2px}
.chips{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:640px}
.chips button,.btn{font:800 14px/1 var(--body);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:8px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;pointer-events:auto;flex:none}
.chips button[aria-pressed="true"]{background:var(--lava);color:var(--onlava)}
.btn.night[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chips button:focus-visible,.btn:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.namer{display:flex;gap:8px;margin-top:8px}
.namer input{flex:1;min-width:0;font:700 16px var(--body);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 10px}
.namer input:focus-visible{outline:3px solid var(--lava);outline-offset:1px}
#tag{position:fixed;left:0;top:0;transform:translate(-50%,-140%);font-family:var(--display);font-size:17px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:2px 10px 3px;white-space:nowrap;pointer-events:none}
#bubble{position:fixed;left:0;top:0;font-family:var(--display);font-size:clamp(28px,8vw,46px);color:var(--onlava);background:var(--lava);border:3px solid var(--ink);border-radius:20px;padding:4px 16px 6px;box-shadow:0 4px 0 var(--ink);white-space:nowrap;pointer-events:none;transform:translate(-50%,-120%)}
#bubble.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:translate(-50%,-120%) scale(.3)}70%{transform:translate(-50%,-120%) scale(1.15)}100%{transform:translate(-50%,-120%) scale(1)}}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:800;font-size:18px}
</style>

<canvas id="scene" aria-label="A 3D valley with animated dinosaurs"></canvas>
<div class="top"><h1>Luna's Dino Valley</h1><button class="btn night" id="night" aria-pressed="false">Night</button></div>
<div id="tag" hidden>Baby</div>
<div id="bubble" hidden>ROAR!</div>
<div class="bottom">
  <div class="fact" id="fact" aria-live="polite"><b>Welcome to Dino Valley!</b>Tap a dinosaur or a button below. Drag to look around, pinch to zoom.</div>
  <div class="chips" role="group" aria-label="Pick a dinosaur">
    <button id="c-rex" data-key="rex" aria-pressed="false">T. rex</button>
    <button id="c-baby" data-key="baby" aria-pressed="false">Baby</button>
    <button id="c-brachio" data-key="brachio" aria-pressed="false">Long-neck</button>
    <button id="c-stego" data-key="stego" aria-pressed="false">Stegosaurus</button>
    <button id="c-trike" data-key="trike" aria-pressed="false">Triceratops</button>
    <button id="c-ptero" data-key="ptero" aria-pressed="false">Flyer</button>
    <button id="c-eggs" data-key="eggs" aria-pressed="false">Eggs</button>
    <button id="c-all" data-key="all" aria-pressed="true">Whole valley</button>
  </div>
</div>
<div id="err" hidden>The 3D scene couldn't start on this device.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(!window.THREE||!THREE.OrbitControls){document.getElementById('err').hidden=false;return;}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas=document.getElementById('scene');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById('err').hidden=false;return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const sc=document.createElement('canvas');sc.width=4;sc.height=256;
const sx=sc.getContext('2d');const gr=sx.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#4fa9d6');gr.addColorStop(.55,'#b9e3ee');gr.addColorStop(1,'#ffe1a6');
sx.fillStyle=gr;sx.fillRect(0,0,4,256);
const skyTex=new THREE.CanvasTexture(sc);scene.background=skyTex;
scene.fog=new THREE.Fog(0xf1e2b6,70,160);

const camera=new THREE.PerspectiveCamera(50,1,0.1,500);
camera.position.set(0,17,42);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.set(0,3,0);controls.enableDamping=true;controls.enablePan=false;
controls.maxPolarAngle=Math.PI*0.48;controls.minDistance=7;controls.maxDistance=90;
controls.autoRotate=!reduce;controls.autoRotateSpeed=0.45;

const hemi=new THREE.HemisphereLight(0xd8f2ff,0x5d7a3a,0.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0cc,0.95);
sun.position.set(30,50,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:150});
scene.add(sun);

/* helpers */
const matCache={};
function mat(c,extra){const k=c+(extra?JSON.stringify(extra):'');if(!matCache[k])matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,flatShading:true},extra||{}));return matCache[k];}
function mesh(g,m){const x=new THREE.Mesh(g,m);x.castShadow=true;x.receiveShadow=true;return x;}
function ball(r,m,a=1,b=1,c=1){const x=mesh(new THREE.SphereGeometry(r,12,10),m);x.scale.set(a,b,c);return x;}
function rod(r1,r2,len,m){return mesh(new THREE.CylinderGeometry(r1,r2,len,8),m);}
const WHITE=mat(0xffffff),BLACK=mat(0x1a1410),PINK=mat(0xe86f7e);
function eye(p,x,y,z,r){const w=ball(r,WHITE);w.position.set(x,y,z);p.add(w);const q=ball(r*.55,BLACK);q.position.set(x+r*.45,y+r*.1,z+Math.sign(z)*r*.5);p.add(q);}
function leg(len,r1,r2,m,fm){const pv=new THREE.Group();const l=rod(r1,r2,len,m);l.position.y=-len/2;pv.add(l);const f=ball(r2*1.3,fm||m,1.6,.6,1.1);f.position.set(r2*.6,-len,0);pv.add(f);const hip=ball(r1*1.15,m);pv.add(hip);return pv;}
function chain(n,len,r0,r1,m,dir){const segs=[];let parent=null,root=null;
  for(let i=0;i<n;i++){const g=new THREE.Group();const ra=r0+(r1-r0)*i/n,rb=r0+(r1-r0)*(i+1)/n;
    const c=rod(rb,ra,len*1.12,m);c.rotation.z=-Math.PI/2*dir;c.position.x=dir*len/2;g.add(c);g.add(ball(ra,m));
    if(parent){g.position.x=dir*len;parent.add(g);}else root=g;segs.push(g);parent=g;}
  return {root,segs,end:parent};}

/* world */
const ground=mesh(new THREE.CircleGeometry(110,64),mat(0x7cbf4a));ground.rotation.x=-Math.PI/2;scene.add(ground);
const sand=mesh(new THREE.CircleGeometry(6.6,32),mat(0xe8cf8a));sand.rotation.x=-Math.PI/2;sand.position.y=.02;scene.add(sand);
const pond=mesh(new THREE.CircleGeometry(5,32),mat(0x3fa7d6,{roughness:.3,flatShading:false}));pond.rotation.x=-Math.PI/2;pond.position.y=.05;scene.add(pond);
const lilies=[];for(let i=0;i<4;i++){const l=mesh(new THREE.CircleGeometry(.5,10),mat(0x4f9a3a));l.rotation.x=-Math.PI/2;const a=i*1.7,r=1.5+i*.7;l.position.set(Math.cos(a)*r,.07,Math.sin(a)*r);scene.add(l);lilies.push(l);}

// volcano
const volc=new THREE.Group();volc.position.set(-38,0,-46);scene.add(volc);
volc.add(mesh(new THREE.CylinderGeometry(3.4,16,18,14),mat(0x7a5a45)));volc.children[0].position.y=9;
const lavaTop=mesh(new THREE.CylinderGeometry(3.3,3.3,.6,14),mat(0xff7a2f,{emissive:0xff4a10,emissiveIntensity:.9}));lavaTop.position.y=18;volc.add(lavaTop);
for(let i=0;i<3;i++){const s=mesh(new THREE.BoxGeometry(.9,9,.5),mat(0xff7a2f,{emissive:0xff4a10,emissiveIntensity:.7}));const a=.4+i*.55;s.position.set(Math.cos(a)*8.6,13.5,Math.sin(a)*8.6);s.rotation.y=-a;s.rotation.z=.6;volc.add(s);}
const lavaMats=[lavaTop.material,volc.children[2].material];
const lavaLight=new THREE.PointLight(0xff6a20,0,90,1.5);lavaLight.position.set(0,22,0);volc.add(lavaLight);
// night sky: stars, moon, fireflies
const starGeo=new THREE.BufferGeometry(),sp=[];for(let i=0;i<700;i++){const a=Math.random()*Math.PI*2,e=.08+Math.random()*1.3,R=220;sp.push(Math.cos(a)*Math.cos(e)*R,Math.sin(e)*R,Math.sin(a)*Math.cos(e)*R);}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,transparent:true,opacity:0,fog:false}));scene.add(stars);
const moon=new THREE.Mesh(new THREE.SphereGeometry(7,20,16),new THREE.MeshBasicMaterial({color:0xfff6d8,transparent:true,opacity:0,fog:false}));moon.position.set(70,95,-150);scene.add(moon);
const ffGeo=new THREE.BufferGeometry(),ffN=40,ffBase=[];const ffPos=new Float32Array(ffN*3);
for(let i=0;i<ffN;i++){const a=Math.random()*Math.PI*2,r=4+Math.random()*30;ffBase.push([Math.cos(a)*r,1+Math.random()*3,Math.sin(a)*r,Math.random()*6]);}
ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const fireflies=new THREE.Points(ffGeo,new THREE.PointsMaterial({color:0xfff27a,size:5,sizeAttenuation:false,transparent:true,opacity:0}));scene.add(fireflies);
const puffs=[];for(let i=0;i<9;i++){const m=new THREE.MeshStandardMaterial({color:0x8d8a88,transparent:true,opacity:.7,flatShading:true});const p=new THREE.Mesh(new THREE.SphereGeometry(1.6,8,6),m);p.userData.t=i/9;volc.add(p);puffs.push(p);}

// distant hills
for(let i=0;i<14;i++){const a=i/14*Math.PI*2+.2,r=85+(i%3)*8;const h=ball(14+(i%4)*4,mat(i%2?0x6c9a52:0x5f8c48),1.4,.55+(i%3)*.12,1.2);h.position.set(Math.cos(a)*r,0,Math.sin(a)*r);h.castShadow=false;scene.add(h);}

// palms
function palm(x,z,h){const g=new THREE.Group();g.position.set(x,0,z);let y=0,lean=0;const tm=mat(0x8a6238),lm=mat(0x3f9a45),lm2=mat(0x2f7f3a);
  for(let i=0;i<6;i++){const s=rod(.38-i*.03,.45-i*.03,h/6+.1,tm);lean+=.05;s.position.set(lean,y+h/12,0);s.rotation.z=-.06;g.add(s);y+=h/6;}
  const top=new THREE.Group();top.position.set(lean,y,0);g.add(top);
  for(let i=0;i<8;i++){const lg=new THREE.Group();lg.rotation.y=i/8*Math.PI*2;lg.rotation.z=-.45-(i%2)*.2;const lf=mesh(new THREE.ConeGeometry(.75,4.2,4),i%2?lm:lm2);lf.rotation.z=-Math.PI/2;lf.scale.set(.25,1,1);lf.position.x=2;lg.add(lf);top.add(lg);}
  for(let i=0;i<3;i++){const c=ball(.3,mat(0x6b4a2a));c.position.set(Math.cos(i*2)*.4,-.3,Math.sin(i*2)*.4);top.add(c);}
  g.userData.top=top;scene.add(g);return g;}
const palms=[];
[[16,-30],[15.5,200],[16,250]].forEach(([r,deg])=>{const a=deg*Math.PI/180;palms.push(palm(Math.cos(a)*r,Math.sin(a)*r,7));});
for(let i=0;i<16;i++){const a=i/16*Math.PI*2+.15,r=40+(i*7)%16;palms.push(palm(Math.cos(a)*r,Math.sin(a)*r,7+(i%3)*2));}
// bushes and rocks
for(let i=0;i<22;i++){const a=i*2.39,r=8+((i*13)%34);if(Math.abs(r-10)<2.5||Math.abs(r-22)<2.5||Math.abs(r-31)<3.5||Math.abs(r-26.5)<2.5)continue;const b=ball(.9+(i%3)*.4,mat(i%2?0x3e8a3e:0x4f9e43),1.3,.8,1.2);b.position.set(Math.cos(a)*r,.4,Math.sin(a)*r);scene.add(b);}
for(let i=0;i<10;i++){const a=i*1.9+1,r=36+(i*5)%20;const k=mesh(new THREE.DodecahedronGeometry(.8+(i%3)*.5),mat(0x9a948a));k.position.set(Math.cos(a)*r,.4,Math.sin(a)*r);k.rotation.set(i,i*2,0);scene.add(k);}

// clouds
const clouds=[];for(let i=0;i<7;i++){const c=new THREE.Group();for(let j=0;j<4;j++){const b=ball(2.2+j%2,mat(0xffffff),1.4,.8,1);b.castShadow=false;b.position.set(j*2.4-3.6,(j%2)*.8,(j%3)*.8);c.add(b);}c.position.set(-90+i*28,32+(i%3)*5,-40+(i*23)%70);scene.add(c);clouds.push(c);}

/* dinosaurs */
function makeRex(sc=0x4f8a3c,bc=0xd0dc84,dc=0x2f5a26){const g=new THREE.Group(),skin=mat(sc),belly=mat(bc),dark=mat(dc);
  const body=new THREE.Group();body.position.y=3.2;g.add(body);
  body.add(ball(1.1,skin,1.55,1,.95));const bl=ball(1,belly,1.3,.8,.8);bl.position.set(.25,-.32,0);body.add(bl);
  for(let i=0;i<4;i++){const s=ball(.3,dark,.5,1,1.02);s.position.set(-.9+i*.55,.55,0);s.scale.set(.5,.6,3.05);body.add(s);}
  const head=new THREE.Group();head.position.set(1.4,.75,0);body.add(head);
  head.add(ball(.62,skin,1,1.1,.85));
  const skull=mesh(new THREE.BoxGeometry(1.9,.85,1),skin);skull.position.set(.95,.38,0);head.add(skull);
  const brow=mesh(new THREE.BoxGeometry(.5,.18,1.08),dark);brow.position.set(.95,.86,0);head.add(brow);
  for(let i=0;i<5;i++)for(const z of[-.4,.4]){const t=mesh(new THREE.ConeGeometry(.07,.22,4),WHITE);t.rotation.x=Math.PI;t.position.set(.75+i*.3,-.12,z);head.add(t);}
  const jaw=new THREE.Group();jaw.position.set(.35,-.02,0);head.add(jaw);
  const jm=mesh(new THREE.BoxGeometry(1.75,.3,.88),belly);jm.position.set(.9,-.17,0);jaw.add(jm);
  const tg=mesh(new THREE.BoxGeometry(1.1,.08,.45),PINK);tg.position.set(.8,.02,0);jaw.add(tg);
  eye(head,1.05,.62,.5,.16);eye(head,1.05,.62,-.5,.16);
  for(const z of[.65,-.65]){const a=rod(.12,.08,.75,skin);a.position.set(1.15,-.45,z);a.rotation.z=.9;body.add(a);}
  const tail=chain(5,.78,.78,.1,skin,-1);tail.root.position.set(-1.4,.1,0);tail.root.rotation.z=.08;body.add(tail.root);
  const legs=[];for(const z of[.6,-.6]){const l=leg(2.55,.5,.22,skin,dark);l.position.set(-.15,2.8,z);g.add(l);legs.push(l);}
  return {g,body,head,jaw,tail,legs,anchor:head,baseY:3.2,
    anim(t,ph,act){legs[0].rotation.z=Math.sin(ph)*.55;legs[1].rotation.z=-Math.sin(ph)*.55;
      body.position.y=3.2+Math.abs(Math.cos(ph))*.12;
      tail.segs.forEach((s,i)=>s.rotation.y=Math.sin(t*2.2-i*.6)*.14*(1+act*2));
      const roar=act>0?Math.sin(Math.min(act,1)*Math.PI*.5):0;
      head.rotation.z=Math.sin(ph*2)*.04+roar*.35;jaw.rotation.z=-roar*.7-Math.max(0,Math.sin(t*1.3))*.06;
      body.rotation.x=act>0&&!reduce?Math.sin(t*40)*.02*roar:0;}};}

function makeBrachio(){const g=new THREE.Group(),skin=mat(0x5b8fa8),belly=mat(0xbdd8cc),spot=mat(0x3f6f86);
  const body=new THREE.Group();body.position.y=5;g.add(body);
  body.add(ball(1.5,skin,1.6,1,1));const bl=ball(1.4,belly,1.4,.75,.85);bl.position.y=-.35;body.add(bl);
  for(let i=0;i<6;i++){const s=ball(.35,spot,1.3,.4,1);const a=i*1.1;s.position.set(-1.2+i*.5,1.32-Math.abs(i-2.5)*.08,Math.sin(a)*.6);body.add(s);}
  const neck=chain(7,1.05,.62,.28,skin,1);neck.root.position.set(2,.55,0);body.add(neck.root);
  const head=new THREE.Group();head.position.x=1.05;neck.end.add(head);
  const hm=ball(.45,skin,1.5,.85,.95);hm.position.x=.45;head.add(hm);eye(head,.6,.25,.32,.11);eye(head,.6,.25,-.32,.11);
  const mouth=mesh(new THREE.BoxGeometry(.5,.05,.4),BLACK);mouth.position.set(.95,-.1,0);head.add(mouth);
  const tail=chain(6,.95,.72,.08,skin,-1);tail.root.position.set(-2.2,.15,0);tail.root.rotation.z=.25;body.add(tail.root);
  const legs=[];[[1.4,.85,4.8,4.5],[1.4,-.85,4.8,4.5],[-1.4,.85,4.4,4.1],[-1.4,-.85,4.4,4.1]].forEach(([x,z,y,len])=>{const l=leg(len,.55,.42,skin,spot);l.position.set(x,y,z);g.add(l);legs.push(l);});
  return {g,body,head,anchor:head,
    anim(t,ph,act){legs.forEach((l,i)=>l.rotation.z=Math.sin(ph+(i===0||i===3?0:Math.PI))*.28);
      body.position.y=5+Math.abs(Math.cos(ph))*.08;
      const lift=act>0?Math.sin(Math.min(act,1)*Math.PI*.5):0;
      const base=.95+Math.sin(t*.4)*.12+lift*.35;neck.root.rotation.z=base;let sum=base;
      neck.segs.forEach((s,i)=>{if(i){s.rotation.z=-.07;sum-=.07;}s.rotation.y=Math.sin(t*.8+i*.35)*.05;});
      head.rotation.z=-sum-.25+(act>0?Math.sin(t*14)*.08:0);
      tail.segs.forEach((s,i)=>s.rotation.y=Math.sin(t*1.2-i*.5)*.1);}};}

function makeStego(){const g=new THREE.Group(),skin=mat(0xc98a3a),belly=mat(0xead39a),plate=mat(0xd8452e),dark=mat(0x8a5a26);
  const body=new THREE.Group();body.position.y=2.3;body.rotation.z=-.1;g.add(body);
  body.add(ball(1.2,skin,1.75,.95,.95));const bl=ball(1.1,belly,1.5,.7,.8);bl.position.y=-.3;body.add(bl);
  for(let i=0;i<7;i++){const x=-1.65+i*.55,ytop=1.12*Math.sqrt(Math.max(0,1-(x/2.1)**2)),sz=.32+.42*Math.sin(Math.PI*(i+.5)/7);
    for(const z of[.16,-.16]){const p=mesh(new THREE.ConeGeometry(sz,sz*1.9,4),plate);p.scale.z=.25;p.position.set(x+(z>0?0:.27),ytop+sz*.7,z);body.add(p);}}
  const head=new THREE.Group();head.position.set(1.9,-.35,0);body.add(head);
  const nk=ball(.45,skin,1.4,.9,.8);nk.position.x=.2;head.add(nk);const hm=ball(.38,skin,1.6,.8,.9);hm.position.set(.85,-.25,0);head.add(hm);
  eye(head,.95,-.08,.28,.1);eye(head,.95,-.08,-.28,.1);
  const tail=chain(4,.75,.55,.12,skin,-1);tail.root.position.set(-2,.15,0);tail.root.rotation.z=-.12;body.add(tail.root);
  for(const x of[-.25,-.6])for(const s of[1,-1]){const sp=mesh(new THREE.ConeGeometry(.1,.85,5),WHITE);sp.position.set(x,.1,s*.12);sp.rotation.x=s*1.05;tail.end.add(sp);}
  const legs=[];[[1.25,.62,1.65,1.45],[1.25,-.62,1.65,1.45],[-1.15,.7,2.05,1.85],[-1.15,-.7,2.05,1.85]].forEach(([x,z,y,len])=>{const l=leg(len,.42,.3,skin,dark);l.position.set(x,y,z);g.add(l);legs.push(l);});
  return {g,body,head,anchor:head,
    anim(t,ph,act){legs.forEach((l,i)=>l.rotation.z=Math.sin(ph+(i===0||i===3?0:Math.PI))*.4);
      body.position.y=2.3+Math.abs(Math.cos(ph))*.07;head.rotation.z=Math.sin(t*1.6)*.08;
      const sw=act>0?Math.sin(t*12)*.45:0;
      tail.segs.forEach((s,i)=>s.rotation.y=Math.sin(t*2-i*.6)*.15+sw);}};}

function makePtero(){const g=new THREE.Group(),bank=new THREE.Group();g.add(bank);const skin=mat(0xb0603a),wingM=mat(0xe9925c,{side:THREE.DoubleSide});
  bank.add(ball(.5,skin,1.8,.7,.7));
  const head=new THREE.Group();head.position.set(.85,.25,0);bank.add(head);head.add(ball(.32,skin,1.3,1,.9));
  const beak=mesh(new THREE.ConeGeometry(.17,1.5,6),mat(0xe8c26a));beak.rotation.z=-Math.PI/2;beak.position.set(.95,-.05,0);head.add(beak);
  const crest=mesh(new THREE.ConeGeometry(.15,1.3,5),skin);crest.rotation.z=1.15;crest.position.set(-.55,.35,0);head.add(crest);
  eye(head,.2,.12,.24,.1);eye(head,.2,.12,-.24,.1);
  const wings=[];for(const s of[1,-1]){const w=new THREE.Group();w.position.set(.1,.1,s*.3);
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute([.7,0,0, -.6,0,0, .2,0,s*3.6, -.6,0,0, -.4,0,s*2.2, .2,0,s*3.6],3));geo.computeVertexNormals();
    const wm=new THREE.Mesh(geo,wingM);wm.castShadow=true;w.add(wm);bank.add(w);wings.push([w,s]);}
  const tl=mesh(new THREE.ConeGeometry(.12,.8,5),skin);tl.rotation.z=Math.PI/2;tl.position.x=-1.1;bank.add(tl);
  return {g,bank,head,anchor:head,
    anim(t,ph,act){const f=Math.sin(t*(act>0?3:5.5))*(act>0?.25:.6);wings.forEach(([w,s])=>w.rotation.x=-s*f);bank.rotation.x=act>0?0:-.28;bank.rotation.z=act>0?-.35*Math.sin(Math.min(act,1)*Math.PI):Math.sin(t*5.5)*.05;}};}

function makeTrike(){const g=new THREE.Group(),skin=mat(0x8a6fb0),belly=mat(0xd9cdea),frillM=mat(0xf0b030),horn=mat(0xf6efdc),dark=mat(0x5e4a80);
  const body=new THREE.Group();body.position.y=2.4;g.add(body);
  body.add(ball(1.3,skin,1.6,.95,1));const bl=ball(1.2,belly,1.4,.7,.85);bl.position.y=-.35;body.add(bl);
  for(let i=0;i<5;i++){const s=ball(.3,dark,1.2,.4,1);s.position.set(-1.2+i*.6,1.18-Math.abs(i-2)*.08,(i%2?.35:-.35));body.add(s);}
  const head=new THREE.Group();head.position.set(1.9,.05,0);body.add(head);
  const hm=ball(.72,skin,1.35,.9,.95);hm.position.x=.45;head.add(hm);
  const beak=mesh(new THREE.ConeGeometry(.33,.8,6),mat(0x6a5a50));beak.rotation.z=-Math.PI/2;beak.position.set(1.55,-.22,0);head.add(beak);
  const frill=mesh(new THREE.CylinderGeometry(1.45,1.45,.18,16),frillM);frill.rotation.z=Math.PI/2-.5;frill.position.set(-.15,.65,0);head.add(frill);
  const inner=mesh(new THREE.CylinderGeometry(1.05,1.05,.2,16),dark);inner.rotation.z=Math.PI/2-.5;inner.position.set(-.08,.68,0);head.add(inner);
  for(const z of[.32,-.32]){const h=mesh(new THREE.ConeGeometry(.14,1.3,6),horn);h.rotation.z=-1.05;h.position.set(1.1,.85,z);head.add(h);}
  const nh=mesh(new THREE.ConeGeometry(.11,.5,6),horn);nh.rotation.z=-.6;nh.position.set(1.3,.32,0);head.add(nh);
  eye(head,.85,.3,.5,.12);eye(head,.85,.3,-.5,.12);
  const tail=chain(3,.75,.6,.1,skin,-1);tail.root.position.set(-1.95,.1,0);tail.root.rotation.z=.15;body.add(tail.root);
  const legs=[];[[1.25,.75,1.95,1.75],[1.25,-.75,1.95,1.75],[-1.15,.8,2.05,1.85],[-1.15,-.8,2.05,1.85]].forEach(([x,z,y,len])=>{const l=leg(len,.48,.38,skin,dark);l.position.set(x,y,z);g.add(l);legs.push(l);});
  return {g,body,head,anchor:head,
    anim(t,ph,act){legs.forEach((l,i)=>l.rotation.z=Math.sin(ph+(i===0||i===3?0:Math.PI))*.38);
      const stomp=act>0&&act<1?Math.abs(Math.sin(act*Math.PI*4))*.35:0;
      body.position.y=2.4+Math.abs(Math.cos(ph))*.07+stomp;
      head.rotation.y=act>0&&act<1?Math.sin(t*12)*.35:0;head.rotation.z=Math.sin(t*1.3)*.05;
      tail.segs.forEach((s,i)=>s.rotation.y=Math.sin(t*1.8-i*.6)*.15);}};}

// nest
const nest=new THREE.Group();nest.position.set(13,0,12);scene.add(nest);
const nr=mesh(new THREE.TorusGeometry(1.7,.55,8,18),mat(0x8a6a3a));nr.rotation.x=-Math.PI/2;nr.position.y=.4;nest.add(nr);
const straw=mesh(new THREE.CircleGeometry(1.7,16),mat(0xb08a4a));straw.rotation.x=-Math.PI/2;straw.position.y=.2;nest.add(straw);
const eggM=mat(0xf3ead2,{side:THREE.DoubleSide}),dotM=mat(0x9db86a);
for(const [x,z] of[[-.7,.5],[.6,.7]]){const e=ball(.5,eggM,1,1.3,1);e.position.set(x,.75,z);nest.add(e);}
const egg=new THREE.Group();egg.position.set(0,.75,-.55);nest.add(egg);
const bottom=mesh(new THREE.SphereGeometry(.55,12,8,0,Math.PI*2,Math.PI/2,Math.PI/2),eggM);bottom.scale.y=1.3;egg.add(bottom);
const lid=new THREE.Group();egg.add(lid);const lidM=mesh(new THREE.SphereGeometry(.55,12,8,0,Math.PI*2,0,Math.PI/2),eggM);lidM.scale.y=1.3;lid.add(lidM);
for(let i=0;i<5;i++){const d=ball(.08,dotM);const a=i*1.3;d.position.set(Math.cos(a)*.5,.2+(i%2)*.25,Math.sin(a)*.5);lid.add(d);}
const baby=new THREE.Group();egg.add(baby);const bh=ball(.4,mat(0x7cc75a),1.15,1,1);baby.add(bh);eye(baby,.25,.15,.25,.1);eye(baby,.25,.15,-.25,.1);
const bm=mesh(new THREE.BoxGeometry(.3,.04,.3),BLACK);bm.position.set(.4,-.12,0);baby.add(bm);baby.scale.setScalar(.01);

/* controllers */
const dinos={
  rex:{...makeRex(),r:10,a:0,speed:.16,dir:1,step:4.2,dist:17,ty:3.5,
    title:'T. rex',bubble:'ROAR!',fact:'Tyrannosaurus rex was about as long as a school bus. Its biggest teeth were as long as bananas!'},
  brachio:{...makeBrachio(),r:31,a:2.2,speed:.045,dir:1,step:2.2,dist:30,ty:7,
    title:'Brachiosaurus',bubble:'Munch munch',fact:'This long-neck could reach leaves about as high as a four-story building. It ate plants all day long.'},
  stego:{...makeStego(),r:22,a:4,speed:.09,dir:-1,step:4.5,dist:15,ty:2.5,
    title:'Stegosaurus',bubble:'Swish!',fact:'The spikes on its tail have a funny name: the thagomizer! It swung them to keep hungry dinosaurs away.'},
  trike:{...makeTrike(),r:26.5,a:5.2,speed:.07,dir:1,step:4,dist:15,ty:2.5,
    title:'Triceratops',bubble:'Hmph!',fact:'Triceratops means "three-horned face." It had one of the biggest heads of any animal that ever lived on land.'},
  baby:{...makeRex(0x7cc75a,0xeef0a8,0x4f9a3c),r:10,a:0,speed:0,dir:1,step:7.5,dist:9,ty:1.6,follow:'rex',
    title:'Baby',bubble:'rawr!',fact:'This baby T. rex follows its mom everywhere. Young T. rex had long, skinny legs and were speedy runners.'},
  ptero:{...makePtero(),r:19,a:1,speed:.3,dir:1,step:0,dist:20,ty:0,fly:true,
    title:'Pteranodon',bubble:'Wheee!',fact:'Surprise! Pteranodon was a flying reptile, not a dinosaur. Its wings stretched wider than a car is long.'},
};
const eggsInfo={title:'Dino eggs',bubble:'Crack!',fact:'Baby dinosaurs hatched from eggs. Some dinosaur parents built nests to keep their eggs safe.',anchor:egg,dist:10};
Object.entries(dinos).forEach(([k,d])=>{d.ph=0;d.act=0;d.move=1;scene.add(d.g);d.g.traverse(o=>o.userData.key=k);});
nest.traverse(o=>o.userData.key='eggs');
dinos.baby.g.scale.setScalar(.42);
const tagEl=document.getElementById('tag');
let babyName='Baby';try{babyName=localStorage.getItem('dinoValleyBabyName')||'Baby';}catch(e){}
function setBabyName(n){babyName=n;dinos.baby.title=n;tagEl.textContent=n;try{localStorage.setItem('dinoValleyBabyName',n);}catch(e){}}
setBabyName(babyName);tagEl.hidden=false;

// day / night
const nightBtn=document.getElementById('night');let night=0,nightTarget=0,lastNight=-1;
nightBtn.addEventListener('click',()=>{nightTarget=nightTarget?0:1;nightBtn.setAttribute('aria-pressed',String(!!nightTarget));nightBtn.textContent=nightTarget?'Day':'Night';});
const C=h=>new THREE.Color(h);
const skyDay=[C('#4fa9d6'),C('#b9e3ee'),C('#ffe1a6')],skyNight=[C('#070b26'),C('#182457'),C('#4b3b6e')];
const fogDay=C(0xf1e2b6),fogNight=C(0x1a2046),hemiDay=C(0xd8f2ff),hemiNight=C(0x6f7fc8),sunDay=C(0xfff0cc),sunNight=C(0xa8b8ff);
function applyNight(k){const hex=i=>'#'+skyDay[i].clone().lerp(skyNight[i],k).getHexString();
  const g=sx.createLinearGradient(0,0,0,256);g.addColorStop(0,hex(0));g.addColorStop(.55,hex(1));g.addColorStop(1,hex(2));sx.fillStyle=g;sx.fillRect(0,0,4,256);skyTex.needsUpdate=true;
  scene.fog.color.copy(fogDay).lerp(fogNight,k);hemi.color.copy(hemiDay).lerp(hemiNight,k);hemi.intensity=.75-.45*k;
  sun.color.copy(sunDay).lerp(sunNight,k);sun.intensity=.95-.6*k;
  lavaMats.forEach(m=>m.emissiveIntensity=.8+1.4*k);lavaLight.intensity=k*2.2;
  stars.material.opacity=k;moon.material.opacity=k;fireflies.material.opacity=k;}

/* UI */
const factEl=document.getElementById('fact'),bubble=document.getElementById('bubble');
const buttons=[...document.querySelectorAll('.chips button')];
let sel='all',bubbleFor=null,bubbleT=0,zoomT=0,eggT=0;
function say(text,anchor){bubble.textContent=text;bubble.hidden=false;bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');bubbleFor=anchor;bubbleT=2.2;}
function select(key){sel=key;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));zoomT=1.4;
  if(key==='all'){factEl.innerHTML='<b>Welcome to Dino Valley!</b>Tap a dinosaur or a button below. Drag to look around, pinch to zoom.';bubble.hidden=true;return;}
  const d=key==='eggs'?eggsInfo:dinos[key];
  factEl.innerHTML='';const b=document.createElement('b');b.textContent=d.title;factEl.append(b,d.fact);
  if(key==='baby'){const f=document.createElement('form');f.className='namer';
    const inp=document.createElement('input');inp.id='babyname';inp.maxLength=16;inp.placeholder='Give the baby a name';inp.value=babyName==='Baby'?'':babyName;inp.setAttribute('aria-label','Baby dinosaur name');
    const sb=document.createElement('button');sb.className='btn';sb.type='submit';sb.textContent='Save name';f.append(inp,sb);factEl.append(f);
    f.addEventListener('submit',e=>{e.preventDefault();const n=inp.value.trim();if(!n)return;setBabyName(n);b.textContent=n;inp.blur();dinos.baby.act=.001;say('Hi, I\'m '+n+'!',dinos.baby.anchor);});}
  if(key==='eggs'){eggT=5;}else{d.act=0.001;}
  say(d.bubble,d.anchor);}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.key)));

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down[0],dy=e.clientY-down[1];down=null;if(dx*dx+dy*dy>64)return;
  const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects([...Object.values(dinos).map(d=>d.g),nest],true)[0];if(hit&&hit.object.userData.key)select(hit.object.userData.key);});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?62:50;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* loop */
const clock=new THREE.Clock(),tmp=new THREE.Vector3(),want=new THREE.Vector3(),wp=new THREE.Vector3(),home=new THREE.Vector3(0,3,0);
let t=0;
function frame(){const dt=Math.min(clock.getDelta(),.05);t+=dt;
  for(const d of Object.values(dinos)){
    if(d.act>0){d.act+=dt/1.6;if(d.act>2)d.act=0;}
    const target=d.act>0&&!d.fly?0:1;d.move+=(target-d.move)*Math.min(1,dt*4);
    if(d.follow){const m=dinos[d.follow];d.move=m.move;d.a=m.a-.7*m.dir;d.r=m.r-.8;}else d.a+=d.speed*d.dir*dt*d.move;
    d.ph+=dt*d.step*d.move;
    const ca=Math.cos(d.a),sa=Math.sin(d.a);
    if(d.fly){const dive=d.act>0?Math.sin(Math.min(d.act,1)*Math.PI)*10:0;d.g.position.set(ca*d.r,14+Math.sin(t*.7)*1.5-dive,sa*d.r);}
    else d.g.position.set(ca*d.r,0,sa*d.r);
    const dx=-sa*d.dir,dz=ca*d.dir;d.g.rotation.y=Math.atan2(-dz,dx);
    d.anim(t,d.ph,d.act);}
  // eggs
  if(eggT>0){eggT-=dt;const k=Math.min(1,(5-eggT)/.6),out=eggT<.6?eggT/.6:k;
    egg.rotation.z=(5-eggT)<.6?Math.sin(t*30)*.15:0;lid.position.set(-.3*out,.7*out,0);lid.rotation.z=.9*out;baby.scale.setScalar(Math.max(.01,out*.9));baby.position.y=.25*out;baby.rotation.y=Math.sin(t*3)*.4;}
  else{egg.rotation.z=Math.sin(t*1.7)>.93?Math.sin(t*25)*.08:0;}
  // world motion
  puffs.forEach(p=>{p.userData.t=(p.userData.t+dt*.08)%1;const u=p.userData.t;p.position.set(Math.sin(u*6+p.id)*1.5,19+u*16,u*4);p.scale.setScalar(.6+u*1.8);p.material.opacity=.75*(1-u);});
  clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>110)c.position.x=-110;});
  palms.forEach((p,i)=>p.userData.top.rotation.z=Math.sin(t*.9+i)*.04);
  lilies.forEach((l,i)=>l.position.y=.07+Math.sin(t*1.5+i)*.02);
  night+=(nightTarget-night)*Math.min(1,dt*1.8);if(Math.abs(night-lastNight)>.002){applyNight(night);lastNight=night;}
  if(night>.01){ffBase.forEach((b,i)=>{ffPos[i*3]=b[0]+Math.sin(t*.6+b[3])*1.2;ffPos[i*3+1]=b[1]+Math.sin(t*1.3+b[3]*2)*.6;ffPos[i*3+2]=b[2]+Math.cos(t*.5+b[3])*1.2;});ffGeo.attributes.position.needsUpdate=true;}
  // camera follow
  if(sel==='all')want.copy(home);else if(sel==='eggs')nest.getWorldPosition(want).add(tmp.set(0,1,0));
  else{const d=dinos[sel];want.copy(d.g.position);want.y+=d.ty;}
  tmp.copy(want).sub(controls.target).multiplyScalar(1-Math.exp(-dt*3));controls.target.add(tmp);camera.position.add(tmp);
  if(zoomT>0){zoomT-=dt;const dist=sel==='all'?44:(sel==='eggs'?eggsInfo.dist:dinos[sel].dist);tmp.copy(camera.position).sub(controls.target);const L=tmp.length();tmp.setLength(L+(dist-L)*Math.min(1,dt*3));camera.position.copy(controls.target).add(tmp);}
  controls.update();
  renderer.render(scene,camera);
  // bubble
  if(!bubble.hidden){bubbleT-=dt;if(bubbleT<=0)bubble.hidden=true;else{bubbleFor.getWorldPosition(wp);wp.project(camera);
    if(wp.z>1){bubble.style.visibility='hidden';}else{bubble.style.visibility='visible';bubble.style.left=((wp.x+1)/2*innerWidth)+'px';bubble.style.top=((1-wp.y)/2*innerHeight)+'px';}}}
  // baby's name tag
  dinos.baby.head.getWorldPosition(wp);wp.y+=.7;wp.project(camera);
  const talking=!bubble.hidden&&bubbleFor===dinos.baby.anchor;
  if(wp.z>1||talking){tagEl.style.visibility='hidden';}else{tagEl.style.visibility='visible';tagEl.style.left=((wp.x+1)/2*innerWidth)+'px';tagEl.style.top=((1-wp.y)/2*innerHeight)+'px';}
  requestAnimationFrame(frame);}
frame();
})();
</script>
