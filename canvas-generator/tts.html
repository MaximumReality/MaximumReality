
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THROUGH THE SCREEN - Visualizer</title>
<style>

</style></head><body>
<canvas id="c"></canvas>

<div class="ui"><button id="play">PLAY / PAUSE</button><button id="rec">● REC</button><input id="file" type="file" accept="audio/*"></div>

 // door
 const doorW=Math.min(260*dpr,w*0.38), doorH=210*dpr, doorX=w-doorW-18*dpr, doorY=h-doorH-22*dpr-(w<700*dpr?70*dpr:0); ctx.fillStyle='rgba(8,10,22,0.9)'; roundRect(ctx,doorX,doorY,doorW,doorH,6*dpr); ctx.fill(); const doorInset=14*dpr, dX=doorX+doorInset, dY=doorY+doorInset, dW=doorW-doorInset*2, dH=doorH-doorInset*2-20*dpr; const dg=ctx.createLinearGradient(dX,dY,dX+dW,dY+dH); dg.addColorStop(0,'#1a0f2e'); dg.addColorStop(1,'#2a0a3a'); ctx.fillStyle=dg; ctx.fillRect(dX,dY,dW,dH); ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.beginPath(); ctx.ellipse(dX+dW*0.5,dY+dH*0.5-8*dpr,12*dpr,14*dpr,0,0,7); ctx.fill(); ctx.fillRect(dX+dW*0.5-10*dpr,dY+dH*0.5+6*dpr,20*dpr,28*dpr); ctx.save(); ctx.translate(dX+dW,dY); const open=0.18+levels.bass*0.12; ctx.transform(1-open*0.3,0,-open*0.8,1,0,0); ctx.fillStyle='#0f0f1a'; ctx.fillRect(-dW*0.18,0,dW*0.18,dH); ctx.fillStyle='#151528'; ctx.fillRect(-dW,0,dW,dH); ctx.fillStyle='rgba(0,255,255,0.8)'; ctx.beginPath(); ctx.arc(-dW+10*dpr,dH*0.5,3*dpr,0,7); ctx.fill(); ctx.restore(); ctx.fillStyle='#fff'; ctx.font='700 '+9*dpr+'px monospace'; ctx.fillText('ANOTHER VERSION OF YOU',doorX+8*dpr,doorY+doorH-6*dpr);
 // error
